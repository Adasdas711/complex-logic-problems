name: Сборка

# Изменили задачи (src/) → проверки → пересборка занятий (zanyatiya/, src/docs/, README)
# и данных сайта (site_src/data/) → GitHub Pages.
# Пересобранное робот коммитит сам; такой коммит новую сборку не запускает.
# Сайт — index.html в корне репозитория + site_src/. Публикация включается сама,
# когда репозиторий станет публичным (Settings → Pages → Source: GitHub Actions).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sborka-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Проверка карточек
        run: python3 src/scripts/validate.py
      - name: Пересчёт ответов программой
        run: |
          python3 src/scripts/check_subst.py
          python3 src/scripts/check_answers.py

      - name: Пересборка занятий
        run: python3 src/scripts/build.py
      - name: Данные сайта
        run: python3 src/scripts/site.py
      - name: Сохранить пересобранное
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- zanyatiya src/docs README.md site_src/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- zanyatiya src/docs README.md site_src/data
            git commit -m "🤖 Пересборка занятий и сайта после изменения задач"
            git push
          else
            echo "Занятия и данные сайта актуальны."
          fi
      - name: Передать сайт на публикацию
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
