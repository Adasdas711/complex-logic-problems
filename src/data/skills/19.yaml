# Раздел 19 — «Логическая физика» (1972), глава третья «Эмпирические предметы» (с. 111–189).
# Обозначения — src/docs/04-oboznacheniya.md, раздел «Логическая физика».
skills:
  - {id: 19-types, kind: definition, label: "§ 1", section: 1, page: 111, statement: "логические типы эмпирических предметов различаются по типам терминов («тело», «состояние», «событие», «изменение», «превращение»); условия приписывания предикатов и их смысл различны", errors: ["один и тот же смысл предиката при разных типах субъектов"]}
  - {id: 19-z, kind: method, label: "§ 1, утверждение z", section: 1, page: 111, statement: "«всякий эмпирический предмет возникает, существует и разрушается» (z) неверно для $s(x \\vee {\\sim}x)$ (иначе $s{\\sim}(x \\vee {\\sim}x)$) и для Мира в целом; z уместно лишь как часть определения типа предметов", errors: ["z как логическая истина обо всех эмпирических предметах", "вывод о возникновении Мира в целом"]}
  - {id: 19-body, kind: definition, label: "§ 2", section: 2, page: 112, statement: "$a$ — эмпирическое тело относительно $\\alpha$ е. т. е. $a$ — эмпирический предмет и $l\\{a, \\alpha\\} > 0$; следствие: $l\\{a, \\alpha\\} = 0$ ⇒ не тело относительно $\\alpha$; ослабленное: для любого $\\alpha$ $l\\{a, \\alpha\\} > 0$", errors: ["малая длина как нулевая", "тело относительно одного $\\alpha$ как тело в ослабленном смысле"]}
  - {id: 19-AF1, kind: axiom, label: "АФ¹", section: 2, page: 113, statement: "$\\vdash A \\to (l\\{a, \\alpha\\} > 0)$, $A$ — «$a$ есть эмпирический индивид относительно $\\alpha$»; ослабленно $\\vdash B \\to (\\forall\\alpha)(l\\{a, \\alpha\\} > 0)$"}
  - {id: 19-change, kind: definition, label: "§ 3", section: 3, page: 113, statement: "$sx \\Rightarrow sy$: состояния одного индивида, $sy$ позже, $\\vdash {\\sim}(x \\wedge y)$; $a \\downarrow x \\Rightarrow a \\downarrow y$; частные случаи 1)–8)", errors: ["${\\sim}$ и $\\urcorner$: $s{\\sim}P(a) \\Rightarrow sP(a)$ как случай 6)", "7) и 8) перепутаны", "неисключающие состояния как превращение", "состояния разных индивидов"]}
  - {id: 19-abbr, kind: definition, label: "§ 3", section: 3, page: 114, statement: "$a \\Rightarrow b$ — сокращение для $s(I \\rightharpoonup a) \\Rightarrow s(I \\rightharpoonup b)$: смена состояний одного предмета", errors: ["превращение как уничтожение $a$ и возникновение нового $b$"]}
  - {id: 19-dur, kind: definition, label: "§ 3, АФ²", section: 3, page: 115, statement: "изменения характеризуются длительностью $l\\{a, \\alpha\\}$ ($\\alpha$ — способ временного порядка); эмпирическое изменение: $l\\{a, \\alpha\\} > 0$; АФ²: $\\vdash B \\to (\\forall\\alpha)(l\\{a, \\alpha\\} > 0)$; пространственная протяжённость изменения — лишь по договорённости", errors: ["пространственная длина изменения"]}
  - {id: 19-trans, kind: definition, label: "§ 3", section: 3, page: 115, statement: "переходное состояние $s({\\sim}x \\wedge {\\sim}y)$; для $P(a)$, $\\urcorner P(a)$ — $s?P(a)$; для $E(a)$, $\\urcorner E(a)$ — $s?E(a)$"}
  - {id: 19-term-meas, kind: method, label: "§ 4", section: 4, page: 115, statement: "терминологические и измеренческие проблемы; пример Иркутск — Новосибирск", errors: ["ошибка в установлении порядка как неверное употребление термина"]}
  - {id: 19-physics, kind: method, label: "§ 4", section: 4, page: 116, statement: "физические теории не вводят пространственно-временные термины впервые; базисные случаи; экспликация для трудных случаев; наложение совокупностей терминов; перенос терминологии эмпирических предметов на пространство и время; определения через другие термины не дают первичной ясности (с. 117)", errors: ["физика впервые определила «одновременно»", "буквальное «время течёт вспять» без анализа"]}
  - {id: 19-order-terms, kind: definition, label: "§ 5", section: 5, page: 117, statement: "простейшие пространственно-временные термины — значения $> \\alpha$, $< \\alpha$, $= \\alpha$ (аксиомы как C1–C7, с. 79, 82); дологические операции; тела — в пространственном, изменения — во временном порядке; точки и моменты; это предикаты, а не субъекты (с. 118)", errors: ["точка — тело без длины", "термины порядка как субъекты о пространстве"]}
  - {id: 19-space3, kind: definition, label: "§ 5", section: 5, page: 118, statement: "три смысла «данное пространство $A$» (без индивидов; с граничными $a^i$; с предметами — кусок материи или «тонкая» материя); то же для времени $B$ (с. 119–120); пространство и время в целом: вместилище / чистая длительность или мир вещей / событий", errors: ["искривление «вместилища»"]}
  - {id: 19-space-crit, kind: method, label: "§ 5", section: 5, page: 121, statement: "объединение всех структур практически немыслимо, класс всех способов логически невозможен — рассуждения о целом гипотетичны; явная схема «если изъять…, то…» — условие невыполнимо, схема несостоятельна, «если бы» не спасает; определяются выражения, а не слова «пространство», «время» (с. 122)", errors: ["«если бы можно было» как исправление", "Df выражения как определение слова"]}
  - {id: 19-quant, kind: definition, label: "§ 6", section: 6, page: 122, statement: "«всегда», «иногда», «везде» — неявные кванторы $(\\forall t)x$, $(\\exists t)x$, $(\\forall s)x$, $(\\exists s)x$", errors: ["«всегда» не квантор"]}
  - {id: 19-Et, kind: definition, label: "§ 7", section: 7, page: 122, statement: "$Et(a)$ — «$a$ существует во время $t$»; $t^1 > t^2$ — «позже» (с. 123)"}
  - {id: 19-X, kind: axiom, label: "§ 7, X", section: 7, page: 123, statement: "$X \\equiv Df. X^1 \\wedge X^2 \\wedge X^3$: до возникновения и после исчезновения не существует, между — существует", errors: ["возрождение того же индивида после разрушения"]}
  - {id: 19-AF34, kind: axiom, label: "АФ³, АФ⁴", section: 7, page: 123, statement: "$\\vdash (E\\alpha(a) \\wedge (\\exists\\beta)((\\beta < \\alpha) \\wedge {\\sim}E\\beta(a)) \\to (\\forall\\gamma)((\\gamma < \\beta) \\to {\\sim}E\\gamma(a))$; АФ⁴ — с $>$"}
  - {id: 19-TF3, kind: theorem, label: "ТФ³", section: 7, page: 124, statement: "$\\vdash E\\alpha(a) \\wedge E\\gamma(a) \\to (\\forall\\beta)((((\\beta < \\alpha) \\wedge (\\gamma < \\beta)) \\vee ((\\beta > \\alpha) \\wedge (\\gamma > \\beta))) \\to E\\beta(a))$; доказательство 1–30, обозначения $(N \\to)$, $(\\to N)$", errors: ["замена знака порядка лишь в одном месте"]}
  - {id: 19-AF-nc, kind: axiom, label: "§ 7, схемы 1–4", section: 7, page: 125, statement: "с учётом ${\\sim}$ и $\\urcorner$ АФ³, АФ⁴ заменяются схемами с $\\urcorner E$ и $?E$; 18, 19 эквивалентны АФ³, АФ⁴"}
  - {id: 19-Espace, kind: definition, label: "§ 8", section: 8, page: 126, statement: "бесконечность пространства — замена для «ряд пространственных структур бесконечен»; $aRb$ существует е. т. е. $a$, $b$ существуют и отношение именно таково; пространство не существует без предметов, время — без изменений (из определения); данное пространство ⇐ структура ⇐ предметы и порядок; пространство вообще ⇐ какое-то данное; одновременность вещей / разновременность изменений, «однопространственность» (с. 127)", errors: ["положение как результат наблюдений", "время существования данного времени"]}
  - {id: 19-pos, kind: definition, label: "§ 9", section: 9, page: 127, statement: "положение — место в рядах и положение внутри структур; «во время $t$», «в месте $s$» — любой способ", errors: ["единственный допустимый способ"]}
  - {id: 19-same, kind: definition, label: "§ 10", section: 10, page: 128, statement: "тождество по признакам $(\\forall P)(P(a) \\leftrightarrow P(b))$ ≠ один и тот же индивид: 1) $(\\forall\\alpha)(\\forall\\beta)(a = \\beta b)$, 2) $(\\forall\\alpha)(E\\alpha(a) \\leftrightarrow E\\alpha(b))$; контрапозиция 2); отрицание — «не один и тот же», а не «различны» (с. 130)", errors: ["тождественны во всём ⇒ один индивид", "различаются ⇒ разные индивиды"]}
  - {id: 19-same-str, kind: definition, label: "§ 10, рис. 8", section: 10, page: 129, statement: "структуры: пп. 1–2 — слабо тот же самый; + тождество отношений — сильно (по порядку или с интервалами); выбор — договорённость", errors: ["сохранение расположения без тех же индивидов"]}
  - {id: 19-11-same, kind: definition, label: "§ 11", section: 11, page: 130, statement: "для тождества пространственной структуры $A$ во время $t^1$ и $t^2$ необходимо: каждый $a^i$, взятый в $t^1$, и $a^i$, взятый в $t^2$, — один и тот же предмет; спорно второе условие — сохранение всех отношений между $a^i$", errors: ["считать первое условие достаточным без оговорки о языке", "думать, что второе условие запрещает смену структур"]}
  - {id: 19-11-cond2, kind: theorem, label: "§ 11", section: 11, page: 130, statement: "без второго условия структуры могут изменяться (высказывания «$A$ изменилась» могут быть истинны); со вторым условием все пространственные структуры неизменны по определению: при изменении отношений нельзя сказать, что $A$ в $t^1$ и $A$ в $t^2$ — одна структура; всё, что сказуемо без него, сказуемо с ним в иных выражениях", errors: ["при втором условии говорить «структура изменилась»"]}
  - {id: 19-11-term-t, kind: theorem, label: "§ 11", section: 11, page: 131, statement: "если указание на время введено в термин («$a$, взятый в $t^1$»), то при $t^1 \\neq t^2$ предметы — не один предмет (второй пункт определения § 10), а представители класса $a$; условия применения предикатов изменения исчезают, высказывания об изменении структуры непроверяемы"}
  - {id: 19-11-temp, kind: theorem, label: "§ 11", section: 11, page: 131, statement: "временная структура $B$ из событий $b^1$ ($t^1$), $b^2$ ($t^2$): в другое время $t_2$ события $b^1$, $b^2$ не существуют; высказывания и об изменении, и о неизменности времени непроверяемы; принятие «временные структуры изменяются» ведёт к следствиям, противоречащим определениям (одно событие в разное время), — небрежное обращение со словами, а не физическое допущение", errors: ["неизменность времени как проверяемый факт", "изменение времени как физическая гипотеза"]}
  - {id: 19-11-classes, kind: definition, label: "§ 11", section: 11, page: 132, statement: "уместно говорить лишь об изменении интервала между представителями классов событий и порядка представителей — это не изменение временных структур и времени"}
  - {id: 19-11-gamma, kind: rule, label: "§ 11", section: 11, page: 132, statement: "сравнение времени в разных местах: из $a^1(R^1\\alpha)a^2$ и $b^1(R^2\\beta)b^2$ сравнения нет; нужен единый способ $\\gamma$: $a^1(R^3\\gamma)a^2$ и $b^1(R^4\\gamma)b^2$", errors: ["сравнивать результаты разных способов"]}
  - {id: 19-11-dur, kind: theorem, label: "§ 11", section: 11, page: 132, statement: "изменение продолжительности существования индивидов с изменением условий (микрочастицы, питание) — не изменение хода времени", errors: ["продление жизни частиц как замедление времени"]}
  - {id: 19-11-clocks, kind: interpretation, label: "§ 11", section: 11, page: 133, statement: "часы $\\alpha$ (на $A$) и $\\beta$ (на $B$): осмысленны утверждения 1)–5) о прошедшем времени относительно указанного способа; бессмысленны «для $A$ и $B$ прошло разное время», «время текло с разной скоростью» — и их отрицания; бессмыслицу нельзя доказать и опровергнуть", errors: ["отрицание бессмыслицы считать истинным", "ответ «сколько прошло» без способа отсчёта"]}
  - {id: 19-11-taut, kind: theorem, label: "§ 11", section: 11, page: 133, statement: "«если для каких-то предметов прошло время $x$ относительно $\\alpha$, то для любых предметов за то же время прошло $x$ относительно $\\alpha$» — логическая тавтология (явная форма с. 134)"}
  - {id: 19-12-rev, kind: definition, label: "§ 12", section: 12, page: 134, statement: "обернуть время — в некоторое время иметь $t^1 > t^2$, а в другое $t^2 > t^1$; обратное превращение $B \\Rightarrow A$ — не возврат во времени: оно во время $t^3$ после $t^1$, $t^2$, и полученное $A$ — того же класса, но не тот же $A$", errors: ["обратимость процессов как обратимость времени"]}
  - {id: 19-12-irr, kind: theorem, label: "§ 12", section: 12, page: 135, statement: "время существования данного времени $t$ есть само $t$; $t^1$ не существует в $t^2$ и наоборот; в $t^3$ не существует ни $t^1$, ни $t^2$; отношение между ними изменить нельзя; необратимость — следствие способа выработки терминологии, а не физики"}
  - {id: 19-13-gen, kind: definition, label: "§ 13", section: 13, page: 135, statement: "если $a$ порождает $b$, то для любого способа отсчёта $(\\exists\\alpha)(\\exists\\beta)(E\\alpha(a) \\wedge \\urcorner E\\alpha(b) \\wedge E\\beta(b) \\wedge (\\beta > \\alpha))$ — часть имплицитного определения; без него либо дети и родители не частный случай порождения, либо разговоры теряют смысл", errors: ["возврат к моменту до рождения родителей"]}
  - {id: 19-13-af34, kind: axiom, label: "АФ3, АФ4 (§ 7, с. 123)", section: 13, page: 135, statement: "вернувшийся в $t^2$ не застал существовавшего в $t^1$ индивида $B$ — по АФ3 и АФ4 $B$ не будет существовать после $t^2$; уверенность — из анализа терминов"}
  - {id: 19-14-int, kind: axiom, label: "§ 14", section: 14, page: 136, statement: "интервалы $\\{a, b, \\alpha\\}$, $\\{c, d, \\alpha\\}$, $b > \\alpha c$; сложение: $\\{a,b,\\alpha\\}$, $\\{b,c,\\alpha\\}$ ⇒ $\\{a,c,\\alpha\\}$; деление: $a > \\alpha b$, $b > \\alpha c$, $\\{a,c,\\alpha\\}$ ⇒ $\\{a,b,\\alpha\\}$, $\\{b,c,\\alpha\\}$; два пути эквивалентны", errors: ["сложение несмежных интервалов"]}
  - {id: 19-14-X, kind: definition, label: "§ 14, $X^1$, $X^2$", section: 14, page: 136, statement: "$X^1$: $\\{a,b,\\alpha\\}$, $\\{c,d,\\alpha\\}$, $b > \\alpha c$ ⇒ $\\{b,c,\\alpha\\}$; $X^2$: то же ⇒ $\\{a,d,\\alpha\\}$; «пространство непрерывно» $\\equiv Df. X^1$ (при сложении) или $X^2$ (при делении); аналогично для времени", errors: ["$X^2$ без условия $b > \\alpha c$"]}
  - {id: 19-14-AF56, kind: axiom, label: "АФ5, АФ6", section: 14, page: 137, statement: "внутри — сводится к подструктуре; АФ5: $A$, $B$ — пространственные, $C$ — структура относительно $\\alpha$, $A$, $B$ — подструктуры $C$ ⇒ $C$ пространственная; АФ6: $C$ из элементов $A$ и $B$ (хотя бы по одному) ⇒ $C$ пространственная; аналогично для времени; вариант с делением", errors: ["АФ6 при $C$ без элементов одной из структур"]}
  - {id: 19-15-inv, kind: axiom, label: "§ 15", section: 15, page: 138, statement: "$A$ — пространственная (временная) структура относительно $\\alpha$, $A^*$ — структура из элементов $A$ относительно $\\beta$ ⇒ $A^*$ пространственная (временная); пространство остаётся пространством независимо от способа ограничения, отсчёта, измерения", errors: ["инвариантность как тождество структур $A$ и $A^*$"]}
  - {id: 19-16-defs, kind: definition, label: "§ 16, 1–4", section: 16, page: 138, statement: "$x$, $y$ — «индивид во время $t$ внутри $A$ ($B$) относительно $\\alpha$»; 1) пересекаются е. т. е. $(\\exists I)(x \\wedge y)$; 2) совпадают е. т. е. $(\\forall I)(x \\wedge y)$; 3) не пересекаются е. т. е. $(\\urcorner\\exists I)(x \\wedge y)$; 4) не совпадают е. т. е. $(\\urcorner\\forall I)(x \\wedge y)$; для временных — «место $s$» вместо «время $t$»"}
  - {id: 19-16-places, kind: theorem, label: "§ 16", section: 16, page: 139, statement: "«разные места/времена» — не пересекаются или не совпадают; «одно место/время» — пересекаются или совпадают; «$a$ одновременно $b$» — $a = \\alpha b$ или совпадение интервалов; при «разные = не пересекаются» индивид не может быть одновременно в разных местах; при «разные = не совпадают» — может (в общей части)", errors: ["«так устроена природа»"]}
  - {id: 19-17-exist, kind: definition, label: "§ 17, 1)–5)", section: 17, page: 140, statement: "$s(sx \\Rightarrow sy)$ существует в $t$ е. т. е. 1) в $t^1$ есть $sx$ (нет $sy$); 2) затем в $t^2$ есть $s({\\sim}x \\wedge {\\sim}y)$; 3) затем в $t^3$ есть $sy$ (нет $sx$); 4) $t^1, t^2, t^3$ — непрерывный ряд; 5) $t$ — собственное время; вне его изменения нет", errors: ["изменение существует и после $t^3$"]}
  - {id: 19-17-disc, kind: definition, label: "§ 17", section: 17, page: 139, statement: "изменение дискретно, если не учитывается переходное состояние; абстрактно, если его нет; недискретно, если учитывается (вплоть до непрерывного ряда); предикаты указывают способ анализа"}
  - {id: 19-17-down, kind: definition, label: "§ 17", section: 17, page: 140, statement: "$\\Downarrow(a)$ е. т. е. возможно высказывание с субъектом $a$, истинное в одно время и неистинное в другое, не $E(a)$ и не $\\urcorner E(a)$; $\\Downarrow$ — модификация $\\Rightarrow$", errors: ["возникновение как $\\Downarrow(a)$"]}
  - {id: 19-17-noch, kind: theorem, label: "§ 17", section: 17, page: 141, statement: "предикаты изменения к изменениям неприменимы: «$sx$ превратилось в $sz$» — другое изменение; «иначе» — лишь сравнение изменений одного класса $Ks(sx \\Rightarrow sy)$", errors: ["«изменение изменилось»"]}
  - {id: 19-17-ax, kind: axiom, label: "§ 17, 1–6", section: 17, page: 140, statement: "1. $\\vdash (sx \\Rightarrow sy) \\to {\\sim}(sx \\Rightarrow s{\\sim}y)$; 2. $\\vdash (sx \\urcorner\\!\\Rightarrow sy) \\leftrightarrow {\\sim}(sx \\Rightarrow sy)$; 3. $\\vdash {\\sim}(sx \\Rightarrow sy) \\to x \\vee ((sx \\Rightarrow sz) \\wedge {\\sim}(y \\wedge z))$; 4. $\\vdash {\\sim}y \\to {\\sim}(sx \\Rightarrow sy)$; 5. $\\vdash x \\to {\\sim}(sx \\Rightarrow sy)$; 6. $\\vdash (sx \\Rightarrow sy) \\to ((sx \\Rightarrow s{\\sim}x) \\wedge (s{\\sim}y \\Rightarrow sy))$", errors: ["обращение 4: ${\\sim}(sx \\Rightarrow sy) \\to {\\sim}y$", "контрапозиция без перестановки"]}
  - {id: 19-18-move, kind: definition, label: "§ 18", section: 18, page: 141, statement: "перемещение: $x$ — «$a$ в месте $\\alpha$», $y$ — «$a$ в месте $\\beta$», места разные, $sx$ предшествует $sy$; $sx \\Rightarrow sy$ — «$a$ переместилось из $\\alpha$ в $\\beta$»: в $t^1$ в $\\alpha$, в $t^2$ в $\\beta$, $t^2 > t^1$; «пребывает в $\\alpha$»: в $\\alpha$ в $t^1$, $t^2$ и в любое время между"}
  - {id: 19-18-ambig, kind: definition, label: "§ 18", section: 18, page: 141, statement: "$\\Downarrow(a)$ «тело движется» двусмысленно: переходное состояние $s({\\sim}x \\wedge {\\sim}y)$ или экспликация: в $t$ есть область $\\alpha$, для которой неверно «$a$ в $\\alpha$» и неверно «$a$ не в $\\alpha$»"}
  - {id: 19-18-inst, kind: theorem, label: "§ 18", section: 18, page: 142, statement: "при разных местах как непересекающихся: $a$ не может быть одновременно в разных местах при одном способе порядка; различие приборов $A$, $B$ по способам — места нельзя считать разными; мгновенное перемещение логически невозможно; его допущение — физическое (не учитывать время или абстрактные предметы)", errors: ["два прибора — тело в двух местах"]}
  - {id: 19-19-para, kind: method, label: "§ 19, 1–6", section: 19, page: 143, statement: "переходное состояние: 1. ${\\sim}P(a) \\wedge {\\sim}\\urcorner P(a)$; при отождествлении $\\urcorner$ с $\\sim$ — 2. ${\\sim}P(a) \\wedge {\\sim}{\\sim}P(a)$; 3. ${\\sim}{\\sim}P(a) \\dashv\\vdash P(a)$; 4. ${\\sim}P(a) \\wedge P(a)$; по К$^i$ — 5. $(\\exists x)({\\sim}P(x) \\wedge P(x))$, 6. ${\\sim}(\\forall x)(P(x) \\vee {\\sim}P(x))$"}
  - {id: 19-19-err, kind: theorem, label: "§ 19", section: 19, page: 144, statement: "ошибка: допущен неклассический случай (три возможности $P(a)$, $\\urcorner P(a)$, ${\\sim}P(a) \\wedge {\\sim}\\urcorner P(a)$), где неверны $\\vdash P(a) \\vee \\urcorner P(a)$ и ${\\sim}\\urcorner P(a) \\vdash P(a)$, а применяются правила классического случая (две возможности); не эмпирическое наблюдение и не аксиома (логически противоречиво)", errors: ["парадокс как опытный факт", "закон исключённого третьего неверен"]}
  - {id: 19-20-proc, kind: definition, label: "§ 20", section: 20, page: 144, statement: "процесс — упорядоченный во времени ряд изменений: для соседних $a \\Rightarrow b$, $b \\Rightarrow c$ при $a$ в $t^a$, $b$ в $t^b$, $c$ в $t^c$: $t^c > t^b$, $t^b > t^a$; состояния одного индивида $A$", errors: ["состояния разных индивидов"]}
  - {id: 19-20-exist, kind: theorem, label: "§ 20", section: 20, page: 144, statement: "существование процесса — по типу термина: $(a \\Rightarrow b) \\wedge (b \\Rightarrow c)$ существует е. т. е. существуют оба изменения в порядке; «процесс индивида $A$» — достаточно одного изменения"}
  - {id: 19-20-par1, kind: method, label: "§ 20", section: 20, page: 145, statement: "«не имеет начала» двусмысленно: нет начального элемента (из этого не следует несуществование) или не начинался (состояние не сменялось — процесс не существует); первый парадокс — смешение понятий", errors: ["нет начала ⇒ не существует"]}
  - {id: 19-20-par2, kind: method, label: "§ 20", section: 20, page: 145, statement: "второй парадокс: $a \\Rightarrow c^1, \\ldots, c^n \\Rightarrow b$ и бесконечное разложение; на каждое изменение нужно время — результат смешения абстрактных и эмпирических процессов", errors: ["перенос свойств абстрактного процесса на эмпирический"]}
  - {id: 19-21-abs, kind: axiom, label: "§ 21, 1–2", section: 21, page: 146, statement: "для абстрактных: 1. $(\\exists x)(x = 0)$; 2. $(\\forall x)(\\exists y)((x > 0) \\wedge (y > 0) \\wedge (x > y))$; для эмпирических — соприкасаются или нет; между соприкасающимися нельзя поместить индивид", errors: ["допущения 1–2 для эмпирических"]}
  - {id: 19-21-excl, kind: theorem, label: "§ 21", section: 21, page: 146, statement: "«интервал $\\{a,b,\\alpha\\}$» уместно лишь при $a > \\alpha b$; исключаются ${\\sim}(a > \\alpha b) \\wedge {\\sim}(b > \\alpha a)$ и $(b > \\alpha I) \\wedge (I > \\alpha a)$ (выводы на с. 146)"}
  - {id: 19-21-res, kind: theorem, label: "§ 21", section: 21, page: 147, statement: "при $a > \\alpha b$: $\\vdash {\\sim}(a \\parallel \\alpha b) \\leftrightarrow (\\mathrm{M}I)((a > \\alpha I) \\wedge (I > \\alpha b)) \\vee (?\\mathrm{M}I)((a > \\alpha I) \\wedge (I > \\alpha b))$; с $\\exists$ вместо $\\mathrm{M}$ — аналогично; $(\\mathrm{M}I)$/$(\\exists I)$ — поместить хотя бы один; $(?\\mathrm{M}I)$/$(?\\exists I)$ — не больше одного и не меньше нуля", errors: ["${\\sim}(a \\parallel \\alpha b)$ как «не соприкасаются»"]}
  - {id: 19-21-AF78, kind: axiom, label: "АФ7, АФ8", section: 21, page: 147, statement: "АФ7. $(l\\{a,b,\\alpha\\} = min) \\dashv\\vdash (a \\parallel \\alpha b)$; АФ8. $(l\\{a,b,\\alpha\\} \\geqslant min) \\dashv\\vdash {\\sim}(a \\parallel \\alpha b)$; $\\geqslant min$ — сокращение $(> min) \\vee (= min)$"}
  - {id: 19-21-TF4, kind: theorem, label: "ТФ4", section: 21, page: 148, statement: "вывод 1–11 по Д$^{12}$, Д$^{11}$, У$^7$, Д$^{16}$, У$^1$, $x \\vee x \\dashv\\vdash x$, УП$^i$, Д$^{14}$: $\\vdash (\\forall z)(lz \\geqslant min)$, $\\vdash (\\forall z){\\sim}(lz < min)$, $\\vdash (\\urcorner\\exists z)(lz < min)$"}
  - {id: 19-21-TF5, kind: theorem, label: "ТФ5", section: 21, page: 149, statement: "из $\\vdash (lx = ly) \\vee (lx > ly) \\vee (lx < ly) \\vee (lx ?> ly)$, ${\\sim}(ly < min)$, $(lz > ly) \\wedge (lz = min) \\vdash (ly < min)$, $(lz ?> ly) \\vdash {\\sim}(lz > ly)$ — вывод 1–10: $\\vdash (\\exists x)(\\forall y){\\sim}(lx > ly)$"}
  - {id: 19-21-TF6, kind: theorem, label: "АФ9, ТФ6", section: 21, page: 149, statement: "АФ9. $\\vdash (l\\{c,\\alpha\\} = l\\{a \\downarrow x, b \\downarrow x, \\alpha\\})$, $x$ — $(a \\parallel \\alpha c) \\wedge (c \\parallel \\alpha b)$; ТФ6. $\\vdash (\\forall x)(l\\{x,\\alpha\\} \\geqslant min)$, $\\vdash (\\forall x){\\sim}(l\\{x,\\alpha\\} < min)$; $\\vdash (\\urcorner\\exists x)(l\\{x,\\alpha\\} < min)$; $\\vdash (\\forall\\alpha)(\\forall x){\\sim}(l\\{x,\\alpha\\} < min)$"}
  - {id: 19-21-TF7, kind: theorem, label: "ТФ7", section: 21, page: 150, statement: "сближение $a$ и $b$ — конечная серия скачкообразных уменьшений до минимума; ТФ7. $\\vdash (\\exists x)(\\forall y)((l\\{x,\\alpha\\} \\leqslant l\\{y,\\alpha\\}) \\wedge (l\\{x,\\alpha\\} > 0))$; относится к длинам и длительностям; отношения и протяжённости меняются квантами", errors: ["непрерывное сближение до нуля", "ТФ7 как существование нулевой протяжённости"]}
  - {id: 19-speed, kind: definition, label: "§ 22", section: 22, page: 151, statement: "скорость процесса $A$ — $m/n$: $m$ последовательных изменений за время $n$; $m \\geqslant 1$, $n \\geqslant min > 0$, $n$ конечно; при $m = 0$ процесса нет; узкое понятие — однородные изменения класса $B$; перемещение: $m$ одинаковых перемещений = расстояние", errors: ["процесс с нулевой скоростью", "деление расстояния на время как нечто иное, чем подсчёт $m$"]}
  - {id: 19-speed-bounds, kind: theorem, label: "§ 22", section: 22, page: 152, statement: "скорость всякого процесса конечна ($k \\geqslant min$, $k \\leqslant n$, $n/k$ конечно); верхний предел — каждое изменение минимальной длительности, ряд непрерывен; нижний — $1/n$ при $m = 1$", errors: ["число изменений больше $n/k_{min}$"]}
  - {id: 19-TF8, kind: theorem, label: "ТФ8 (§ 22)", section: 22, page: 152, statement: "$\\vdash (\\exists a)(\\forall b)(a \\geqslant qb)$ — максимальная скорость; следствие $\\vdash (\\exists \\alpha)(\\forall \\beta)(l\\alpha \\leqslant l\\beta) \\to (\\exists a)(\\forall b)(a \\geqslant qb)$ и ТФ7 $\\vdash (\\exists x)(\\forall y)((l\\{x, \\alpha\\} \\leqslant l\\{y, \\alpha\\}) \\wedge (l\\{x, \\alpha\\} > 0))$", errors: ["«для всякой скорости возможна большая»"]}
  - {id: 19-TF9, kind: theorem, label: "ТФ9 (§ 22)", section: 22, page: 153, statement: "непрерывное перемещение в $\\{t^1, t^2, \\alpha\\}$: для $t_1 \\parallel \\alpha t_2$ внутри интервала ${\\sim}(s^1 \\parallel \\beta s^2)$; за минимальное время проходится расстояние больше минимального; скорость непрерывно движущегося тела больше минимальной"}
  - {id: 19-zeno-achilles, kind: method, label: "§ 23", section: 23, page: 153, statement: "вывод «Ахиллес не догонит черепаху» логически не следует из посылок (ассоциации); нужна переформулировка: пока черепаха не прошла $s^i$, Ахиллес не проходит больше $s^{i-1}$ («стержень»); тогда не догонит лишь в абстрактном процессе; в эмпирическом — соприкосновение, интервал минимален, сокращение скачками", errors: ["разрешение парадокса ссылкой на математику", "перенос абстрактного процесса на эмпирический"]}
  - {id: 19-quanta, kind: axiom, label: "АФ16 (§ 24)", section: 24, page: 155, statement: "разность различных протяжённостей не меньше минимальной; иерархия длин; $(\\forall a)(\\forall b)(\\exists c)((a > lc) \\wedge (c > lb))$ неприемлемо для эмпирических; $X$ и АФ16 $\\vdash (\\exists a)(\\exists b)(\\urcorner \\exists c)((la > lc) \\wedge (lc > lb))$; квантовая природа — не буквальная; «Дихотомия» не имеет силы для эмпирических тел", errors: ["сколь угодно близкие различные длины", "пространство буквально состоит из квантов"]}
  - {id: 19-world-def, kind: definition, label: "§ 25", section: 25, page: 155, statement: "$\\vdash (\\forall x)(x \\in \\text{Мир})$; Мир — эмпирический индивид; единственность $\\vdash (\\forall x)(\\forall y)((x \\rightharpoonup \\text{Мир}) \\wedge (y \\rightharpoonup \\text{Мир}) \\to (x \\rightleftharpoons y))$; $\\vdash E(\\text{Мир}) \\equiv (\\exists x)E(x)$; $\\vdash \\urcorner E(\\text{Мир}) \\equiv (\\forall x)\\urcorner E(x)$"}
  - {id: 19-world-origin, kind: method, label: "§ 25", section: 25, page: 156, statement: "«Мир не возник» двусмысленно: 1) отрицание $\\urcorner E(\\text{Мир}) \\Rightarrow E(\\text{Мир})$ — точка отсчёта и метки должны быть вне Мира, что исключено; утверждение неопределённо (отрицание обоих противоположных суждений без противоречия); 2) $(\\forall x)(\\exists y)(x > \\alpha y)$ — осмысленно, не влечёт несуществования; аналогично «Мир не перемещается»", errors: ["наблюдение возникновения Мира", "из отсутствия начала — несуществование", "одно из противоположных суждений обязательно истинно"]}
  - {id: 19-world-finite, kind: definition, label: "§ 25", section: 25, page: 157, statement: "конечность/бесконечность Мира в пространстве (актуальная, потенциальная — $\\exists$ / $\\mathrm{M}$) и во времени: прошлое $(\\exists x)(\\forall y)(x \\leqslant \\beta y)$ / $(\\forall x)(\\exists y)(y < \\beta x)$; будущее $(\\mathrm{M}x)(\\forall y)(y \\leqslant \\beta x)$ / $(\\forall x)(\\mathrm{M}y)(y > \\beta x)$; «потенциально … в прошлом», «актуально … в будущем» лишены смысла; все такие утверждения логически выполнимы, невыполнимы лишь противоречивые комбинации", errors: ["$\\mathrm{M}$ для прошлого"]}
  - {id: 19-emp-conn, kind: definition, label: "§ 26", section: 26, page: 158, statement: "эмпирические высказывания, состояния, связи; связь $a$, $b$ опосредована относительно $\\alpha$ е. т. е. найдётся $c$: $\\vdash (y \\wedge z \\to x)$ и $c$ между $a$ и $b$; неопосредованная — отрицание перед «найдётся»; при минимальном интервале связь неопосредована; процесс нахождения посредников конечен, предел — непрерывный ряд", errors: ["бесконечная цепь посредников", "«между» без $\\vdash (y \\wedge z \\to x)$"]}
  - {id: 19-tendency, kind: definition, label: "§ 27", section: 27, page: 159, statement: "оператор $t$: $P$ — предикат ⇒ $tP$ — предикат; $\\vdash P(a) \\to tP(a)$, $\\vdash {\\sim}tP(a) \\to {\\sim}P(a)$; $tP(a) \\wedge {\\sim}P(a)$ выполнимо; при $P(a) \\to {\\sim}Q(a)$ возможно $tP(a) \\wedge tQ(a)$; $x \\to (tP(a) \\to Q(a))$ — $sx$ условие реализации, $Q$ — реализация $tP$", errors: ["${\\sim}P(a) \\vdash {\\sim}tP(a)$", "противоположные тенденции как противоречие"]}
  - {id: 19-conn-paradox, kind: method, label: "§ 28", section: 28, page: 160, statement: "(1) $x \\to (Ra)z$, (2) $y \\to (Ra)v$, (3) $x \\wedge y \\to (Ra)(z \\wedge v)$; опущены различные условия $w^1 \\to {\\sim}y$, $w^2 \\to {\\sim}x$; простейший случай $w^1 = w^3 \\wedge {\\sim}y$, $w^2 = w^3 \\wedge {\\sim}x$ — антецедент (3) противоречив; для $x \\wedge y$ нужно (4) $x \\wedge y \\to (Ra)w$ или правило; разрешение через тенденции $z^*$, $v^*$; вариант с каналами", errors: ["опровержение (1) или (2) совместным действием", "$z^* \\wedge v^*$ как противоречие"]}
  - {id: 19-cond-pred, kind: definition, label: "§ 29, (1)–(6)", section: 29, page: 162, statement: "(1) $P(a) \\equiv Df.\\ (x \\to (Rx)Q(a))$, (2) $\\vdash Q(a) \\to x$; оператор $c$; (3) $(x \\to (Rx)Q(a)) \\wedge {\\sim}x$ ⇒ (6) $cQ(a) \\wedge {\\sim}Q(a)$; при $Q^1(a) \\to {\\sim}Q^2(a)$: $cQ^1(a) \\to {\\sim}cQ^2(a)$", errors: ["смешение $cQ$ и $Q$ («растворим» и «растворяется»)"]}
  - {id: 19-influence, kind: definition, label: "§ 30", section: 30, page: 164, statement: "$\\alpha$ — $P^1(a) \\Rightarrow P^2(a)$, $\\beta$ — $Q^1(b) \\Rightarrow Q^2(b)$; $a$ воздействует на $b$ е. т. е. $\\alpha \\to (R\\alpha)\\beta$, $R$ — «после этого», интервал конечен, $R$ транзитивно, $s\\beta > ts\\alpha$; непосредственное/опосредованное относительно класса $A$; посредники, механизм", errors: ["воздействие без указания класса $A$"]}
  - {id: 19-mechanism, kind: theorem, label: "§ 30", section: 30, page: 164, statement: "при непрерывном ряде $s\\alpha, s\\gamma^1, \\dots, s\\gamma^n, s\\beta$ число посредников конечно (длительности и интервалы не меньше минимума, сумма не больше $t$); для абстрактных событий — бесконечно; ряд с суммой больше $t$ — «мимо цели»; максимальная скорость ни при чём, кроме частного случая перемещения тела $c$; скорость распространения — расстояние / $t$", errors: ["бесконечная детализация механизма", "воздействие как перемещение тела"]}
  - {id: 19-interaction, kind: theorem, label: "§ 30", section: 30, page: 166, statement: "для индивидуальных событий $(\\alpha \\to (R\\alpha)\\beta) \\vdash {\\sim}(\\beta \\to (R\\beta)\\alpha)$; обратное воздействие $\\beta \\to (R\\beta)\\alpha^*$, $\\alpha^*$ после $s\\beta$ и $s\\alpha$; иллюзия одновременного взаимодействия — общие термины событий", errors: ["то же самое воздействие в обе стороны одновременно"]}
  - {id: 19-delay, kind: theorem, label: "§ 30", section: 30, page: 167, statement: "принципы «запаздывания» (чисто логические): 1) результат воздействия обнаруживается не сразу; 2) после прекращения изменений $a$ ещё продолжается изменение $b$; экспликация силы $a \\downarrow (\\exists b)(x \\wedge y \\wedge P(b))$, «к $b$ приложена сила» — $(\\exists a)(x \\wedge y \\wedge P(b))$; экспликация массы", errors: ["мгновенный результат воздействия", "запаздывание как физическая гипотеза"]}
  - {id: 19-cause-senses, kind: definition, label: "§ 31", section: 31, page: 167, statement: "смыслы 1)–4) «$a$ есть причина $b$»; три ответа на «что является причиной $a$?»; нет «единственно правильного» понимания; $sxC^1sy$ — $x \\to (Rx)y$; $sxC^2sy$ — $x \\wedge (Rx)y \\wedge ({\\sim}x \\to (R{\\sim}x){\\sim}y)$; ни один не лучше; ограничения «позитивная», «полная» причина", errors: ["$C^2$ как подлинное понимание причины"]}
  - {id: 19-cause-unique, kind: method, label: "§ 31", section: 31, page: 169, statement: "при $C^2$ возможны $sxC^2sy$ и $szC^2sy$; определение не гарантирует единственности; единодушное согласие — неявное соглашение (определение + иные требования); «Причина $x$» $\\equiv Df.$ «Состояние $sy$ такое, что $sy$ есть причина $sx$»", errors: ["найденная причина исключает другие"]}
  - {id: 19-cause-methods, kind: method, label: "§ 31", section: 31, page: 169, statement: "методы Бэкона — Милля — имплицитные определения: «$a$ есть причина $b$» $\\dashv\\vdash$ «Если наступает $a$, то наступает $b$»; благие пожелания и возможности языка (Мир, Галактика, электроны); причина предшествует следствию; терминология времени вводится независимо от «причины», но не наоборот", errors: ["методы как приёмы при заранее известном смысле «причины»", "причина после следствия", "определение времени через причину"]}
  - {id: 19-32-kinds, kind: definition, label: "§ 32", section: 32, page: 171, statement: "виды причинных отношений состояний $sx$ и $sy$: $x \\to (R^1x)y$; $y \\to (R^2y)x$; ${\\sim}x \\to (R^1{\\sim}x){\\sim}y$; ${\\sim}y \\to (R^2{\\sim}y){\\sim}x$; $(x \\to (R^1x)y) \\wedge y \\wedge (R^2y)x$; $(y \\to (R^2y)x) \\wedge x \\wedge (R^1x)y$; $({\\sim}x \\to (R^1{\\sim}x){\\sim}y) \\wedge x \\wedge (R^1x)y$; $({\\sim}y \\to (R^2{\\sim}y){\\sim}x) \\wedge x \\wedge (R^1x)y$; $(x \\to (R^1x)y) \\wedge (y \\to (R^2y)x)$ и т. п.; общее — условное отношение высказываний о состояниях и временное отношение «вслед за этим» или «до этого»", errors: ["поиск «инварианта» — «подлинного понимания причины»", "смешение $R^1$ и $R^2$"]}
  - {id: 19-32-noinv, kind: method, label: "§ 32", section: 32, page: 171, statement: "употребления «$sx$ есть причина $sy$» различаются: из $x$ логически не следует $y$ (или не предполагается), из причинности и $x$ следует $y$, из причинности и ${\\sim}x$ следует ${\\sim}y$, транзитивность — в одних случаях предполагается, в других нет; искать инвариант бесперспективно; говорить о видах причинных отношений", errors: ["одно «истинное» понимание причины"]}
  - {id: 19-32-rules, kind: rule, label: "§ 32", section: 32, page: 171, statement: "свойства видов определены свойствами высказываний (гл. 2): $(x \\to (R^1x)y) \\vdash ({\\sim}y \\to (R^2{\\sim}y){\\sim}x)$; $(x \\to (R^1x)y) \\wedge (y \\to (R^1y)z) \\vdash (x \\to (R^1x)z)$", errors: ["контрапозиция с тем же $R^1$", "транзитивность при смешанных $R^1$, $R^2$"]}
  - {id: 19-32-conseq, kind: definition, label: "§ 32", section: 32, page: 171, statement: "если $a$ есть причина $b$, то $b$ есть следствие $a$ — определение термина «следствие»", errors: ["следствие (эмпирическое) смешивается с логическим следованием"]}
  - {id: 19-32-ind, kind: definition, label: "§ 32", section: 32, page: 171, statement: "для индивидуальных $sx$, $sy$: «$sx$ есть причина $sy$» $\\dashv\\vdash (sx \\rightharpoonup a) \\wedge (sy \\rightharpoonup b) \\wedge$ «$a$ есть причина $b$»; «причина» сначала определена для общих терминов", errors: ["для индивидуальных состояний достаточно следования по времени"]}
  - {id: 19-32-gen, kind: rule, label: "§ 32", section: 32, page: 172, statement: "для общих терминов причинное отношение — через условное отношение, предполагающее обобщения: $(x \\to (Rx)y) \\dashv\\vdash (\\forall sx)(Rx)y$; для индивидуальных состояний кроме следования по времени нужно нечто, имеющее силу для классов состояний", errors: ["post hoc: «после этого — значит вследствие этого»"]}
  - {id: 19-32-past, kind: theorem, label: "§ 32", section: 32, page: 172, statement: "большинство утверждений о причинной связи событий прошлого нельзя ни подтвердить, ни отвергнуть: для них нельзя построить истинные $x \\to (Rx)y$; «$a$ причина $b$» неявно принимают как постулаты, а разговоры вокруг называют обоснованием", errors: ["обоснование принятого постулата как доказательство"]}
  - {id: 19-32-prob, kind: definition, label: "§ 32", section: 32, page: 172, statement: "частные случаи причинных отношений с вероятностью: «Вероятность того, что $sx$ есть причина $sy$, есть $\\alpha$», «Если $x$, то вслед за этим наступает $sy$ с вероятностью $\\alpha$»"}
  - {id: 19-33-det1, kind: definition, label: "§ 33", section: 33, page: 172, statement: "детерминизм (1): для всякого эмпирического состояния есть другое — его причина; модификация (1'): для всякого состояния можно отыскать причину — признаёт и существование, и возможность нахождения, сильнее", errors: ["(1) и (1') как одно и то же", "(1) сильнее (1')"]}
  - {id: 19-33-indet, kind: definition, label: "§ 33", section: 33, page: 173, statement: "индетерминизм — отрицание принципов: отрицание (1) — допущение беспричинных событий; отрицание (1') — лишь допущение, что в некоторых случаях найти причины нельзя", errors: ["невозможность найти причину выдают за беспричинность"]}
  - {id: 19-33-det2, kind: definition, label: "§ 33", section: 33, page: 173, statement: "детерминизм (2): для каждого $sx$ есть $sy$ с $y \\to (Ry)x$ с вероятностью 1, $R$ — временное отношение; $(\\forall a)(\\exists b)(b \\to (Rb)a)$; усиление — такое $sy$ можно обнаружить; отрицание — есть случаи, когда $y \\to (Ry)x$ с вероятностью 1 найти невозможно, возможно лишь с меньшей", errors: ["порядок кванторов $(\\exists b)(\\forall a)$", "$a \\to (Ra)b$ вместо $b \\to (Rb)a$"]}
  - {id: 19-33-det3, kind: definition, label: "§ 33", section: 33, page: 173, statement: "узкий детерминизм: по достаточно полным и точным сведениям о состоянии области мира в данное время можно предсказать её состояние в последующее время; физический — по импульсам и траекториям тел сейчас предвидеть их положения", errors: ["смешение видов детерминизма"]}
  - {id: 19-34-comb, kind: method, label: "§ 34", section: 34, page: 174, statement: "выражения «зависимость», «влияние», «неразрывно связаны», «порождение», «совместность» аморфны; анализ обнаруживает комбинации высказываний типа $x \\to (Rx)y$; их число и устойчивость — по практической целесообразности"}
  - {id: 19-34-sovm, kind: definition, label: "§ 34", section: 34, page: 174, statement: "предметы $a$, $b$ совместны е. т. е. всегда и везде $(E(a) \\leftrightarrow E(b)) \\wedge (\\urcorner E(a) \\leftrightarrow \\urcorner E(b))$; признаки $P$, $Q$ совместны е. т. е. для любого $a$: $(P(a) \\leftrightarrow Q(a)) \\wedge (\\urcorner P(a) \\leftrightarrow \\urcorner Q(a))$", errors: ["опущен второй член с $\\urcorner$", "совместность предметов без «всегда и везде»"]}
  - {id: 19-34-dep, kind: definition, label: "§ 34", section: 34, page: 174, statement: "«зависимость» многосмысленна: состояние от состояния, состояние от предмета, предмет от состояния, предмет от предмета; 1) $sx$ зависит от $sy$ е. т. е. $x$ при условии $z$ и ${\\sim}x$ при условии $z \\wedge y$; 2) — $x$ при $z$ и ${\\sim}x$ при $z \\wedge {\\sim}y$", errors: ["смешение определений (1) и (2)"]}
  - {id: 19-35-sys, kind: definition, label: "§ 35", section: 35, page: 174, statement: "система связей — скопление связей, где связи — элементы связей (связи связей); две связи в связи е. т. е. элементы одной в связи с элементами другой и это влияет на характер хотя бы одной (без неё связь элементов последней иная); аналогично для трёх и более", errors: ["любое скопление связей — система"]}
  - {id: 19-35-ex, kind: interpretation, label: "§ 35", section: 35, page: 174, statement: "пример: $a$ и $c$ воздействуют на $b$; $x \\to (R)y$, $R$ — «одновременно с этим»; ${\\sim}x \\to (R)z$, ${\\sim}(y \\wedge z)$; связь $c$ и $b$ влияет на связь $a$ с $b$; систему можно рассматривать как сложную связь"}
  - {id: 19-35-nosys, kind: theorem, label: "§ 35", section: 35, page: 175, statement: "связи $x \\to (R^1x)y$ и $y \\to (R^2y)z$ не образуют систему — ни одна не влияет на характер другой", errors: ["общий член $y$ как признак системы"]}
  - {id: 19-35-nolog, kind: theorem, label: "§ 35", section: 35, page: 175, statement: "из высказываний об одних связях системы логически не следуют высказывания о других, а из высказываний об отдельных связях — о сложной связи, без внелогических допущений (правило сложения воздействий, параллелограмм сил)", errors: ["вывод о совместном воздействии «по логике»"]}
  - {id: 19-36-thesis, kind: method, label: "§ 36", section: 36, page: 175, statement: "тезис особой логики микромира опирается на свойства объектов и условия познания; логика — не теория бытия, её правила одинаковы для всех наук; различие сфер — лишь в логической структуре терминов и высказываний; кажущиеся ошибки правил — повод искать смешение операторов, отсутствие дифференциации, неуместное употребление", errors: ["правило верно в одной области и ведёт к ошибкам в другой"]}
  - {id: 19-36-three, kind: method, label: "§ 36", section: 36, page: 176, statement: "в микрофизике — высказывания с третьим значением «неопределённо» и дополнительные; трёхзначность не исключительна для микрофизики, правила трёхзначной логики столь же универсальны; для правил вывода достаточно «истинно» и «неистинно»; описание с тремя значениями заменимо описанием с «истинно» и его отрицанием", errors: ["трёхзначность — переворот в способах рассуждения"]}
  - {id: 19-36-sit, kind: interpretation, label: "§ 36", section: 36, page: 177, statement: "ситуация: 1) принять или отвергнуть высказывание об импульсе — нужна возможность измерить (так же координаты); 2) если можно точно измерить импульс (координаты), невозможно точное измерение координат (импульса); описана без предикатов истинностных значений"}
  - {id: 19-36-PQ, kind: definition, label: "§ 36, 1)–3)", section: 36, page: 177, statement: "$P(a)$ — «импульс $a$ можно точно измерить», $Q(a)$ — «координаты $a$ можно точно измерить», $S(a)$ — «импульс $a$ равен $\\alpha$», $T(a)$ — «координаты $a$ равны $\\beta$»; для $P(a)$, $Q(a)$, $\\urcorner P(a)$, $\\urcorner Q(a)$: 1) $x$ истинно е. т. е. на самом деле $x$; 2) $P(a)$ ложно е. т. е. $\\urcorner P(a)$ истинно, и наоборот; 3) неистинность и ложность совпадают (двузначны); если истинно одно из $P(a)$, $Q(a)$, ложно другое", errors: ["$P(a)$ и $Q(a)$ не могут быть оба ложными"]}
  - {id: 19-36-ST, kind: definition, label: "§ 36, 1)–3)", section: 36, page: 177, statement: "1) $S(a)$ истинно е. т. е. $P(a)$ истинно и на самом деле $S(a)$; $\\urcorner S(a)$ — е. т. е. $P(a)$ истинно и на самом деле $\\urcorner S(a)$; так же $T(a)$, $\\urcorner T(a)$ с $Q(a)$; 2) $S(a)$, $\\urcorner S(a)$ неопределённы е. т. е. $P(a)$ ложно; $T(a)$, $\\urcorner T(a)$ — е. т. е. $Q(a)$ ложно; 3) $S(a)$ ложно е. т. е. $\\urcorner S(a)$ истинно, и наоборот; так же $T$", errors: ["$S(a)$ ложно, когда $P(a)$ ложно", "условие истинности $T(a)$ — $P(a)$"]}
  - {id: 19-36-compl, kind: definition, label: "§ 36", section: 36, page: 178, statement: "$x$ и $y$ дополнительны е. т. е. если одно из них истинно или ложно, то другое неопределённо; $S(a)$ и $T(a)$ дополнительны (следствие: если одно из $S(a)$, $T(a)$ истинно или ложно, другое неопределённо)", errors: ["дополнительные = противоречащие", "оба дополнительных могут быть истинны"]}
  - {id: 19-36-conj, kind: theorem, label: "§ 36", section: 36, page: 178, statement: "конъюнкция $x \\wedge y$ дополнительных не может быть истинной: ложна, если одно ложно; если одно истинно — неопределённа (другое неопределённо); неопределённа, если неопределённы оба", errors: ["истина и неопределённость дают истину"]}
  - {id: 19-36-two, kind: method, label: "§ 36, 1)–3)", section: 36, page: 178, statement: "двузначное описание: 1) для $P(a)$, $Q(a)$ и отрицаний неопределённости исключены, «$x$ ложно» → «$x$ неистинно»; 2) «$x$ неопределённо» для $S(a)$, $\\urcorner S(a)$ → «$P(a)$ неистинно» или «$\\urcorner P(a)$ истинно», для $T(a)$, $\\urcorner T(a)$ → то же с $Q(a)$; 3) «$S(a)$ ложно» → «$\\urcorner S(a)$ истинно», «$\\urcorner S(a)$ ложно» → «$S(a)$ истинно», так же $T$; без замен «неопределённо» и «ложно» бессмысленны", errors: ["«$S(a)$ ложно» → «$S(a)$ неистинно»", "«$S(a)$ неопределённо» → «$P(a)$ истинно»"]}
  - {id: 19-36-def2, kind: definition, label: "§ 36, 1–5", section: 36, page: 179, statement: "$Q^1(b)$, $Q^2(b)$ дополнительны е. т. е. с ними координированы $P^1(b)$, $P^2(b)$: 1. $P^1(b) \\to {\\sim}P^2(b)$; 2. $Q^1(b) \\to P^1(b)$; 3. $Q^2(b) \\to P^2(b)$; 4. $\\urcorner Q^1(b) \\to P^1(b)$; 5. $\\urcorner Q^2(b) \\to P^2(b)$"}
  - {id: 19-36-der, kind: theorem, label: "§ 36, 6–10", section: 36, page: 179, statement: "по У3: 6. $P^2(b) \\to {\\sim}P^1(b)$; 7. ${\\sim}P^1(b) \\to {\\sim}Q^1(b)$; 8. ${\\sim}P^2(b) \\to {\\sim}Q^2(b)$; 9. ${\\sim}P^1(b) \\to {\\sim}\\urcorner Q^1(b)$; 10. ${\\sim}P^2(b) \\to {\\sim}\\urcorner Q^2(b)$; по У6 (с 1, 2, 4): $Q^1(b) \\vee \\urcorner Q^1(b) \\to {\\sim}P^2(b)$; по У5 (8, 10): ${\\sim}P^2(b) \\to {\\sim}Q^2(b) \\wedge {\\sim}\\urcorner Q^2(b)$; по У4, Д16, У1: $Q^1(b) \\vee \\urcorner Q^1(b) \\to {\\sim}Q^2(b) \\wedge {\\sim}\\urcorner Q^2(b)$; по П1: $\\to ?Q^2(b)$; по П1 и Д6: ${\\sim}?Q^1(b) \\to ?Q^2(b)$", errors: ["контрапозиция без отрицания обоих членов", "ссылка на У5 там, где нужен У6"]}
  - {id: 19-36-notboth, kind: theorem, label: "§ 36, (1)–(5)", section: 36, page: 180, statement: "если $x$, $y$ дополнительны, то $\\vdash {\\sim}(x \\wedge y)$: (2) $\\vdash Q^1(b) \\wedge Q^2(b) \\to P^1(b) \\wedge P^2(b)$ (1, 2, правила У); (3) $\\vdash Q^1(b) \\wedge Q^2(b) \\to P^1(b) \\wedge {\\sim}P^1(b)$ (6, У); (4) $\\vdash {\\sim}(P^1(b) \\wedge {\\sim}P^1(b))$ (Д13); (5) по У3; итог по Д16, У1, Д14: $\\vdash {\\sim}(Q^1(b) \\wedge Q^2(b))$"}
  - {id: 19-ch1-rules, kind: rule, label: "Д1–Д16, У1–У7, П1–П7", section: 36, page: 34, statement: "правила гл. 1, на которые ссылается § 36: Д1 ${\\sim}{\\sim}x \\dashv\\vdash x$; Д6 ${\\sim}(x^1 \\vee … \\vee x^n) \\dashv\\vdash {\\sim}x^1 \\wedge … \\wedge {\\sim}x^n$, ${\\sim}(x^1 \\wedge … \\wedge x^n) \\dashv\\vdash {\\sim}x^1 \\vee … \\vee {\\sim}x^n$; Д13 $\\vdash {\\sim}(x \\wedge {\\sim}x)$; Д14 если $x \\vdash y$ и $\\vdash x$, то $\\vdash y$; Д16 если $\\vdash x$ и $\\vdash y$, то $\\vdash x \\wedge y$; У1 $(x \\to y) \\wedge x \\vdash y$; У2 $(x \\to y) \\wedge {\\sim}y \\vdash {\\sim}x$; У3 $(x \\to y) \\vdash ({\\sim}y \\to {\\sim}x)$; У4 $(x \\to y) \\wedge (y \\to z) \\vdash (x \\to z)$; У5 $(x \\to y \\wedge z) \\dashv\\vdash (x \\to y) \\wedge (x \\to z)$; У6 $(x \\vee y \\to z) \\dashv\\vdash (x \\to z) \\wedge (y \\to z)$; П1 $?P(a) \\dashv\\vdash {\\sim}P(a) \\wedge {\\sim}\\urcorner P(a)$"}
  - {id: 19-37-scheme, kind: definition, label: "§ 37", section: 37, page: 180, statement: "прогноз по схеме $x^* \\wedge y \\to z^*$: $x^*$ — «$x$ в $t^1$» (состояние области $A$), $z^*$ — «$z$ в $t^2$» после $t^1$; $y$ — то, благодаря чему из $x^*$ получается $z^*$ и без чего нельзя; $z^*$ — прогноз, если получен в $t^1$; $x$ — эмпирическое условие, $y$ — логическое условие прогноза", errors: ["прогноз, полученный в $t^2$", "смешение эмпирического и логического условий"]}
  - {id: 19-37-wv, kind: rule, label: "§ 37", section: 37, page: 181, statement: "логическое условие $y$ — непосредственно $w \\to v$ или есть правила $\\vdash y \\leftrightarrow (w \\to v)$, $y \\dashv\\vdash (w \\to v)$; из $w \\to v$ по правилам (подстановка терминов на место переменных, видовых на место родовых) получается $x^* \\to z^*$; оба — высказывания о связи (временное отношение состояний)"}
  - {id: 19-37-CD, kind: theorem, label: "§ 37", section: 37, page: 181, statement: "детерминизм как эвристический принцип строения $C \\to \\text{Д}$: из неверности $C$ не следует ошибочность $C \\to \\text{Д}$; оно может быть истинным при неистинном $C$ и неистинным при истинном $C$; «в $t^1$ нельзя знать всё» — не аргумент против принципа; «если известно всё в $t^1$, то точно предскажем в $t^2$» нельзя ни подтвердить, ни опровергнуть, если знать всё невозможно", errors: ["ложность антецедента опровергает условное высказывание"]}
  - {id: 19-37-omit, kind: method, label: "§ 37", section: 37, page: 182, statement: "в формулировках детерминизма указывают лишь эмпирическое условие прогноза, опуская логическое; включает ли принцип неограниченную возможность находить логические условия — от ответа зависят весьма различные принципы"}
  - {id: 19-37-compl, kind: theorem, label: "§ 37", section: 37, page: 182, statement: "если в $A^1 \\to B$ и $A^2 \\to C$ антецеденты дополнительны, то $A^1 \\wedge A^2$ не может быть истинным, объединение в $A^1 \\wedge A^2 \\to B \\wedge C$ практически невозможно; при одних условиях — лишь одно; оба — при разных несовместимых $\\alpha$, $\\beta$: ${\\sim}(\\alpha \\wedge \\beta)$; $A^1 \\to {\\sim}A^2$, $\\alpha \\to {\\sim}\\beta$; для эмпирических связей из $A^1 \\wedge A^2$ логически не следует $B \\wedge C$ — такие высказывания не могут быть истинными; итог: в ряде случаев нельзя построить истинные логические условия прогнозов", errors: ["объединение условных высказываний при дополнительных антецедентах"]}
  - {id: 19-38-heur, kind: definition, label: "§ 38", section: 38, page: 183, statement: "эвристические допущения: внелогичны; логически выполнимы, но недоказуемы в логике; эмпирически не подтверждаемы и не отвергаемы; утверждают лишь возможность или невозможность построить высказывания, не определяя их конкретно; не расширяют дедуктивных возможностей, лишь ориентируют; строятся без противоречий по их вине; логических критериев предпочтения нет, кроме дедуктивных отношений между ними", errors: ["эвристическое допущение как эмпирический закон", "логическое предпочтение без дедуктивных отношений"]}
  - {id: 19-38-list, kind: definition, label: "§ 38", section: 38, page: 183, statement: "примеры: «Всякое качественное изменение есть следствие количественных», «Природа непрерывна», «Процессы не кончаются мгновенно» (экстраполяция), «Природа не делает скачков» (интерполяция), «Всё происходит скачкообразно», «Процессы рано или поздно затухают», «Всякий прогресс достигает предела», «Все объекты упорядочены», «В природе господствует хаос»"}
  - {id: 19-38-begin, kind: interpretation, label: "§ 38", section: 38, page: 183, statement: "$(\\forall a)(\\exists b)(b < \\alpha a)$ и «Мир имеет начало во времени» $(\\exists a)(\\forall b)(b \\geqslant \\alpha a)$ ($a$, $b$ — состояния Мира); принимать ли — не компетенция логики; первое: все прошлые состояния пересмотреть нельзя (их бесконечно много), второе: нельзя указать начальное; оба безразличны для эмпирического познания; принятие одного не ведёт к противоречию"}
  - {id: 19-38-expl, kind: interpretation, label: "§ 38", section: 38, page: 184, statement: "«Пространство везде и всегда непусто»: $(\\forall s)(\\forall t)(\\exists a)Ets(a)$ ($s$ — пространства, $t$ — времени, $a$ — тела); «Нет чистой длительности»: $(\\forall t)(\\exists a)Et(a)$ ($a$ — изменения); проверить невозможно"}
  - {id: 19-38-comp, kind: method, label: "§ 38", section: 38, page: 184, statement: "логика компетентна, когда утверждения или их отрицания выводятся из определений терминов, или когда может сказать, что утверждение неопределённо; общего критерия логическое/внелогическое нет; утверждения о минимальных длинах, длительностях, максимальных скоростях — логические, о конечности/бесконечности Мира — внелогические", errors: ["«фундаментальные» утверждения о Мире — логические"]}
  - {id: 19-38-123, kind: theorem, label: "§ 38, (1)–(3)", section: 38, page: 185, statement: "(1) $(\\forall x)(\\exists y)(x > ty)$ — нет начала; (2) $(\\exists x)(\\forall y)(x \\leqslant ty)$ — есть начало; из (1) следует ${\\sim}(2)$, из (2) — ${\\sim}(1)$; не отрицания друг друга: (3) ${\\sim}(1) \\wedge {\\sim}(2)$ — неопределённости; при $t$ как переменной — комбинации $(\\forall t)(1)$, $(\\exists t)(1)$, $(\\forall t)(2)$, $(\\exists t)(2)$ и отрицаний", errors: ["(2) — отрицание (1)", "$x \\geqslant ty$ вместо $x \\leqslant ty$"]}
  - {id: 19-38-indep, kind: metatheorem, label: "§ 38", section: 38, page: 186, statement: "гипотезы (1)–(3) внелогичны: $\\vdash (1)$, $\\vdash (2)$, $\\vdash (3)$ независимы от аксиом и правил; выполнимы: недоказуемы $\\vdash {\\sim}(1)$, $\\vdash {\\sim}(2)$, $\\vdash {\\sim}(3)$; принятие одной не даёт противоречия и не делает доказуемыми другие; пара исключена правилами логики; если из внелогических $w$ следует конъюнкция двух — $w$ противоречиво", errors: ["принятие (1) делает доказуемым (3)"]}
  - {id: 19-38-cons, kind: method, label: "§ 38", section: 38, page: 186, statement: "непротиворечивость системы с $\\vdash (1)$ — через семантическую интерпретацию формул $\\vdash \\alpha(a > \\beta b)$: если $a$ и $b$ различны, $a > \\beta b$ можно приписать $v$; если $a > \\beta b$ можно приписать $v$, то $\\vdash (\\exists b)(a > \\beta b)$ имеет значение $v$; правила не затрагивают утверждений логики; так же для (2), (3); кантовские антиномии — плохая логическая обработка терминологии"}
  - {id: 19-38-space, kind: theorem, label: "§ 38", section: 38, page: 186, statement: "бесконечность в пространстве — по крайней мере три взаимоисключающие гипотезы; гипотезы о числе индивидов: (1) «число индивидов любого скопления в любое время конечно», (2) внутреннее отрицание (1), (3) конъюнкция внешних отрицаний (1) и (2); частные случаи"}
  - {id: 19-38-nihil, kind: interpretation, label: "§ 38, 1–2", section: 38, page: 187, statement: "1. $(\\forall a)(\\exists b)((\\urcorner E(a) \\Rightarrow E(a)) \\to (b \\Rightarrow a))$ — «Из ничего ничто не возникает»; 2. $(\\forall a)(\\exists b)((E(a) \\Rightarrow \\urcorner E(a)) \\to (a \\Rightarrow b))$ — «Нечто не превращается в ничто»; следствия: $(\\forall a)(\\exists b)((\\urcorner E(a) \\Rightarrow E(a)) \\to (E(b) \\Rightarrow \\urcorner E(b)))$, $(\\forall a)(\\exists b)((\\urcorner Et^1(a) \\Rightarrow Et^2(a)) \\to Et^1(b))$, $(\\forall a)(\\exists b)((E(a) \\Rightarrow \\urcorner E(a)) \\to (\\urcorner E(b) \\Rightarrow E(b)))$, $(\\forall a)(\\exists b)((Et^1(a) \\Rightarrow \\urcorner Et^2(a)) \\to Et^2(b))$; одни эвристические гипотезы выводимы из других, поскольку они общие и экспликабельны в языке логики", errors: ["перестановка $b \\Rightarrow a$ и $a \\Rightarrow b$"]}
  - {id: 19-38-types, kind: method, label: "§ 38", section: 38, page: 187, statement: "гипотезы 1–2 осмысленны не для любых эмпирических предметов (отношение «$a$ тяжелее $b$», $aRb$); ограничение осмысленности логическими типами — часть имплицитного определения; сказать, что они имеют смысл лишь для эмпирических тел, — принять это в неявной форме"}
  - {id: 19-39-inert, kind: theorem, label: "§ 39", section: 39, page: 188, statement: "$A$ (инерция): «если тело движется и на него не действуют силы ($X$), то оно движется прямолинейно и равномерно ($Y$), и $(\\forall a)(\\exists b)(b > \\alpha a)$» ($a$, $b$ — положения тела); $A \\vdash B$: «если $X$, то $(\\forall a)(\\exists y)(y > \\alpha a)$» ($y$ — индивиды); конечность Мира: $(\\exists x)(\\forall y)(x \\geqslant \\alpha y) \\vdash C$: ${\\sim}(\\forall a)(\\exists y)(y > \\alpha a)$; из $B$ и $C$ — ${\\sim}X$; конечность делает $A$ бесполезным; логического противоречия нет; при выборе — предпочесть бесконечность", errors: ["из закона инерции следует бесконечность Мира", "конечность противоречит закону инерции логически"]}
  - {id: 19-39-nihil, kind: theorem, label: "§ 39", section: 39, page: 188, statement: "«Из ничего ничто не возникает» и «Нечто не превращается в ничто» логически несовместимы с конечностью Мира во времени в прошлом и в будущем; не следует, что нужно принять бесконечность; более жёсткая связь — противоречие; основание предпочтения"}
  - {id: 19-39-void, kind: theorem, label: "§ 39", section: 39, page: 189, statement: "$A$: $(\\forall \\alpha)(\\forall a)(\\exists b)((b > \\alpha a) \\wedge (a \\parallel \\alpha b))$ — непрерывное окружение; $B$: $(\\forall \\alpha)(\\forall a)(\\exists b)(b > \\alpha a)$ — бесконечность в пространстве; $C$: $(\\forall \\alpha)(\\forall a)(\\exists b)(a \\parallel \\alpha b)$ — нет абсолютной пустоты; $A \\vdash B$, $A \\vdash C$; из $B$ и $C$ не следует $A$; аналогично для времени", errors: ["$B \\wedge C \\vdash A$"]}
