# Раздел 18 — «Логическая физика» (1972), глава вторая «Логические типы терминов и предметов» (с. 54–110).
# В записи «Логической физики» $a \rightharpoonup b$ читается «$a$ есть $b$» (с. 56–57).
skills:
  - {id: 18-types, kind: definition, label: "§ 1", section: 1, page: 54, statement: "логические типы субъектов (индивиды, классы, скопления, отношения, структуры, изменения, связи) и соответствующие типы предметов", errors: ["логический анализ типов как натурфилософия"]}
  - {id: 18-emp, kind: definition, label: "§ 2", section: 2, page: 54, statement: "эмпирические предметы — воздействуют на чувственный аппарат; существуют в определённое время и в определённых областях пространства", errors: ["абстрактный предмет как эмпирический в особых условиях"]}
  - {id: 18-abs-dec, kind: definition, label: "§ 3", section: 3, page: 55, statement: "отвлечение от несущественных признаков оставляет предметы эмпирическими; отвлечение от признаков, без которых эмпирический предмет не существует, даёт абстрактные (идеальные) предметы", errors: ["любое отвлечение даёт абстрактный предмет", "абстрактный термин ничего не обозначает"]}
  - {id: 18-abs-def, kind: definition, label: "§ 3, схемы 1, 2", section: 3, page: 55, statement: "1) $a$ — предметы с $P^1,…,P^n$ без $Q^1,…,Q^m$, хотя эмпирически из $P^i$ следует $Q^j$; 2) $a$ — предметы с $P^1,…,P^n$, если из допущения и принятых утверждений не следует $Q(a)$, то $\\urcorner Q(a)$"}
  - {id: 18-abs-int, kind: interpretation, label: "§ 3", section: 3, page: 56, statement: "эмпирическая интерпретация: решение принять $a \\rightharpoonup b$ ($b$ — абстрактный); подбор $a$ внелогичен; предикат $P$ для $b$ переносится на $a$ лишь по особому решению, возможно через $sQ(a) \\rightharpoonup sP(b)$", errors: ["$a \\rightharpoonup b$ как открытие, а не решение", "автоматический перенос предиката с $b$ на $a$"]}
  - {id: 18-ind, kind: definition, label: "§ 4", section: 4, page: 57, statement: "$b$ индивидуален, е. т. е. $(\\forall a)((a \\rightharpoonup b) \\to (b \\rightharpoonup a))$; следствие: $b \\rightharpoonup a$ для индивидуального $a$ даёт $a \\rightharpoonup b$ и $a \\rightleftharpoons b$", errors: ["индивидуальность по числу предметов («единичность»)"]}
  - {id: 18-I, kind: definition, label: "§ 4", section: 4, page: 57, statement: "термин $I$: $\\vdash (\\forall a)(a \\rightharpoonup I)$ для индивидной $a$; $(a \\rightharpoonup I) \\wedge x \\vdash (\\forall a)x$; $(a \\rightharpoonup I) \\wedge (\\exists a)x \\vdash x$", errors: ["кванторы для индивидуальных терминов меняют смысл"]}
  - {id: 18-Pa, kind: definition, label: "§ 5", section: 5, page: 58, statement: "предикаты $P\\alpha$: $P(a) \\leftrightarrow (min \\leqslant P\\alpha \\leqslant max)$, $\\urcorner P(a) \\leftrightarrow (P\\alpha = 0)$, $P(a) \\leftrightarrow (P\\alpha > 0)$", errors: ["отсутствие признака как неизвестная величина"]}
  - {id: 18-range, kind: definition, label: "§ 5", section: 5, page: 59, statement: "область истинности (класс индивидов) и диапазон истинности (пределы чисел) высказываний $P_\\alpha(a)$"}
  - {id: 18-v, kind: axiom, label: "§ 5", section: 5, page: 60, statement: "$v(x \\wedge y) = min$, $v(x \\vee y) = max$, $(x \\vdash y) \\wedge (v(x) = \\alpha) \\vdash (v(y) \\leqslant \\alpha)$; рост степени истинности не расширяет области истинности, уменьшение не сокращает", errors: ["$v$ конъюнкции — максимум", "заключение истиннее посылок"]}
  - {id: 18-K, kind: definition, label: "§ 6", section: 6, page: 60, statement: "$K$ — оператор, не термин; $a$ — термин-субъект ⇒ $Ka$ — индивидуальный термин-субъект; $Kb \\in Kkl$", errors: ["$K$ как термин", "$Ka$ как общий термин"]}
  - {id: 18-K-ax, kind: axiom, label: "§ 6", section: 6, page: 61, statement: "$(\\forall a)(a \\in Kb) \\wedge (\\forall b)(b \\in Kc) \\vdash (\\forall a)(a \\in Kc)$; $(\\exists a)(a \\in Kb) \\wedge (\\forall b)(b \\in Kc) \\vdash (\\exists a)(a \\in Kc)$; $(a \\in Kb) \\wedge (a \\in Kc) \\vdash (\\exists b)(b \\in Kc)$"}
  - {id: 18-sub, kind: definition, label: "§ 6", section: 6, page: 62, statement: "$(\\forall a)((a \\in A) \\to (a \\in B)) \\dashv\\vdash (A \\subset B)$; $(\\forall a)(a \\in A) \\dashv\\vdash (Ka \\subset A)$; $\\cap$, $\\cup$, $\\bar{\\ }$ через $\\wedge$, $\\vee$, двойное дополнение"}
  - {id: 18-cl-pred, kind: definition, label: "§ 6", section: 6, page: 63, statement: "подкласс, пересекаются / не пересекаются, пустой / непустой, универсальный / неуниверсальный, эквивалентны, конечный / бесконечный, мощность = число элементов", errors: ["пустой = несуществующий", "неуниверсальный = пустой"]}
  - {id: 18-cl-E, kind: definition, label: "§ 6, § 9", section: 6, page: 62, statement: "первичный класс существует, раз построен термин; производный — если соблюдены правила и нет противоречия; существование класса не зависит от существования индивидов", errors: ["класс существует, только если существуют его элементы"]}
  - {id: 18-skop, kind: definition, label: "§ 7", section: 7, page: 64, statement: "скопление: «скопление $a$» не обязательно индивидуально; пространственные предикаты уместны; скопление из $a$ и $b$ существует е. т. е. существуют $a$ и $b$", errors: ["скопление как класс"]}
  - {id: 18-state, kind: definition, label: "§ 8", section: 8, page: 65, statement: "$sx$ — термин состояния; $a^i$ свободен в $x$, если в $\\alpha$ нет кванторов по $a^i$; $sx$ индивидуален е. т. е. все свободные термины индивидуальны; событие — состояние, где $x$ стало истинным; всякое событие есть состояние"}
  - {id: 18-E-gen, kind: definition, label: "§ 9", section: 9, page: 66, statement: "$E(a) \\equiv Df.(\\exists I)((I \\rightharpoonup a) \\wedge E(I))$; $\\urcorner E(a) \\equiv Df.(\\forall I)((I \\rightharpoonup a) \\to \\urcorner E(I))$; $?E(a) \\equiv Df. {\\sim} E(a) \\wedge {\\sim}\\urcorner E(a)$", errors: ["$\\urcorner E(a)$, если не существует хотя бы один индивид"]}
  - {id: 18-E-enka, kind: definition, label: "§ 9, 4–6", section: 9, page: 66, statement: "$E(a^1,…,a^n) \\dashv\\vdash \\bigwedge E(a^i)$; $\\urcorner E(a^1,…,a^n) \\dashv\\vdash \\bigvee \\urcorner E(a^i)$", errors: ["энка существует, если существует хотя бы один"]}
  - {id: 18-E-state, kind: axiom, label: "§ 9, 7–9", section: 9, page: 67, statement: "7. $E(sx) \\dashv\\vdash x$; 8. $\\urcorner E(sx) \\dashv\\vdash {\\sim} x$; 9. ${\\sim} E(sx) \\dashv\\vdash \\urcorner E(sx)$; следствия $E(s(x \\wedge y)) \\dashv\\vdash E(sx) \\wedge E(sy)$, $\\vdash E(s(x \\vee {\\sim} x))$, $\\vdash \\urcorner E(s(x \\wedge {\\sim} x))$"}
  - {id: 18-E-other, kind: definition, label: "§ 9", section: 9, page: 67, statement: "первичные классы: $E(Ka)$ е. т. е. $a$ — термин-субъект; скопления: по перечню, по числу, через $(\\exists I)E(I \\downarrow (I \\in a))$; абстрактные: эмпирическое и логическое существование"}
  - {id: 18-modal, kind: definition, label: "§ 10", section: 10, page: 69, statement: "$M(a) \\equiv Df.M(sE(a))$; $N(sx) \\equiv Df.\\urcorner M(s{\\sim}x)$; $\\urcorner N(sx) \\equiv Df.M(s{\\sim}x)$; $?N(sx) \\equiv Df.?M(s{\\sim}x)$; при совпадении отрицаний $N(sx) \\equiv Df.{\\sim}M(s{\\sim}x)$; $M$, $N$, $C$ — предикаты, не субъекты", errors: ["возможность как эмпирический предмет"]}
  - {id: 18-M, kind: definition, label: "§ 11", section: 11, page: 70, statement: "$M$ для родовых $sx$ — как $E$; аксиомы с $\\vee$, $\\wedge$; $M(s(x \\wedge y)) \\dashv\\vdash M(sx) \\wedge M(sy) \\wedge {\\sim}(x \\to {\\sim}y)$; для абстрактных и классов $M = E$; для индивидуальных $sx$: $M(sx) \\equiv Df.(\\forall sa)(a \\to {\\sim}(a \\to {\\sim}x))$", errors: ["$M(sx) \\wedge M(sy) \\vdash M(s(x \\wedge y))$"]}
  - {id: 18-C, kind: definition, label: "§ 12", section: 12, page: 72, statement: "$C(sx) \\equiv Df.(x \\wedge M(s{\\sim}x))$; $\\urcorner C(sx) \\equiv Df.(x \\wedge \\urcorner M(s{\\sim}x))$; смысл предиката отличен от оснований уверенности", errors: ["случайность несуществующего состояния"]}
  - {id: 18-fat, kind: theorem, label: "§ 13", section: 13, page: 73, statement: "верны $x \\vdash M(sx)$, $N(sx) \\vdash x$; неверны $x \\vdash N(sx)$, $M(sx) \\vdash x$, ${\\sim} x \\vdash \\urcorner M(sx)$; фатализм — следствие переопределения $E(a) \\vdash N(sE(a))$", errors: ["«что существует, то необходимо»"]}
  - {id: 18-Mop, kind: definition, label: "§ 14", section: 14, page: 74, statement: "$(\\mathrm{M}a)x \\equiv Df.M(a \\downarrow x)$, $(\\mathrm{N}a)x \\equiv Df.N(a \\downarrow x)$; $(\\exists a)x \\dashv\\vdash E(a \\downarrow x)$; $(\\forall a)x \\dashv\\vdash U(a \\downarrow x)$; $(\\exists a)x \\vdash (\\mathrm{M}a)x$; $(\\urcorner\\mathrm{M}a)x \\vdash (\\urcorner\\exists a)x$"}
  - {id: 18-pot, kind: definition, label: "§ 15", section: 15, page: 75, statement: "актуальное наличие признака — $\\exists$ в определяющей части; потенциальное — $\\mathrm{M}$"}
  - {id: 18-p, kind: axiom, label: "§ 16", section: 16, page: 76, statement: "$\\vdash 0 \\leqslant p(x) \\leqslant 1$; $(p(x) = 0) \\leftrightarrow \\urcorner M(sx)$; $(p(x) > 0) \\leftrightarrow M(sx)$; $p(x \\wedge y) \\leqslant min$; $p(x \\vee y) \\geqslant max$; $p({\\sim}x) = 1 - p(x)$", errors: ["$p(x \\wedge y) = min$", "возможное рано или поздно осуществится"]}
  - {id: 18-rel, kind: definition, label: "§ 17", section: 17, page: 77, statement: "$aRb$, $a \\urcorner Rb$; $(a?Rb) \\equiv Df.{\\sim}(aRb) \\wedge {\\sim}(a \\urcorner Rb)$; рефлексивность, симметричность, транзитивность"}
  - {id: 18-cmp-def, kind: definition, label: "§ 18", section: 18, page: 79, statement: "$(a = pb) \\equiv Df.(a \\urcorner > pb) \\wedge (b \\urcorner > pa)$; $(a \\urcorner = pb) \\equiv Df.(a > pb):(b > pa)$; $(a < pb) \\equiv Df.(b > pa)$; $(a \\urcorner < pb) \\equiv Df.(b > pa):(a = pb)$", errors: ["$a \\urcorner < pb$ как $a > pb$"]}
  - {id: 18-C1-7, kind: axiom, label: "C1–C7 (§ 18)", section: 18, page: 79, statement: "1. $\\vdash (a \\urcorner > pa)$; 2. $(a > pb) \\vdash (b \\urcorner > pa)$; 3. $(a \\urcorner > pb) \\vdash (b > pa):(a = pb)$; 4–7 — транзитивность и смешанные схемы", errors: ["несимметричность как $(a \\urcorner > pb) \\vdash (b > pa)$"]}
  - {id: 18-ord, kind: definition, label: "§ 19", section: 19, page: 80, statement: "порядок задаётся относительно точки отсчёта и способа $\\alpha$; $a(R\\alpha)b$; из $a(R^1\\alpha)b$ не следует ни $a(R^1\\beta)b$, ни ${\\sim}(a(R^1\\beta)b)$; $>\\alpha$ — аксиомы УП, аналогичные C1–C7", errors: ["смена способа упорядочивания логически меняет порядок"]}
  - {id: 18-betw, kind: definition, label: "§ 20", section: 20, page: 82, statement: "$a$ между $b$ и $c$ относительно $\\alpha$ е. т. е. $(a > \\alpha b) \\wedge (c > \\alpha a)$ или $(b > \\alpha a) \\wedge (a > \\alpha c)$; для скоплений — каждый элемент между"}
  - {id: 18-relE, kind: definition, label: "§ 21", section: 21, page: 82, statement: "$s(aRb)$ индивидуален е. т. е. $a$, $b$ индивидуальны; существует е. т. е. существуют $a$, $b$ и операции дают именно $R$"}
  - {id: 18-num, kind: definition, label: "§ 22", section: 22, page: 83, statement: "для чисел $>, <, =$ — предикаты порядка; $(a = b) \\dashv\\vdash (a \\rightleftharpoons b)$; $(la = lb) \\dashv\\vdash (la \\rightleftharpoons lb)$; $la > lb$ тождественно $a > lb$; для чисел $\\urcorner$ и $\\sim$ совпадают"}
  - {id: 18-row, kind: definition, label: "§ 23", section: 23, page: 84, statement: "ряд: скопление, где для любых $a, b$: $a > \\alpha b$ или $b > \\alpha a$; соседние $a \\mid \\alpha b$ — между ними нет элемента; отрезок ряда; существование ряда", errors: ["$a = \\alpha b$ — элементы одного ряда", "выборка элементов как отрезок"]}
  - {id: 18-touch, kind: definition, label: "§ 24, 1–3", section: 24, page: 87, statement: "$a \\parallel \\alpha b$: $(a > \\alpha b) \\vee (b > \\alpha a)$ и $(\\urcorner\\mathrm{M} I)$ поместить $I$ между ними; $a \\urcorner \\parallel \\alpha b$ и ${\\sim}(a \\parallel \\alpha b)$ различны; $(a \\parallel \\alpha b) \\vdash (a \\mid \\alpha b)$", errors: ["${\\sim}(a \\parallel \\alpha b)$ как «не соприкасаются»"]}
  - {id: 18-cont-emp, kind: definition, label: "§ 25", section: 25, page: 87, statement: "эмпирический ряд непрерывен е. т. е. все соседние соприкасаются; прерывен е. т. е. для некоторых соседних ${\\sim}(a \\parallel \\alpha b)$"}
  - {id: 18-ends, kind: definition, label: "§ 26", section: 26, page: 88, statement: "начальный / конечный элемент, отсутствие начального / конечного; неопределённость ${\\sim}x \\wedge {\\sim}y$; конец одного ряда не всегда начало другого; нет начального — не значит, что ряд не существует", errors: ["отсутствие начала проверяется эмпирически"]}
  - {id: 18-int, kind: definition, label: "§ 27", section: 27, page: 90, statement: "«интервал» — часть выражения $\\{a, b, \\alpha\\}$, уместного лишь при $a > \\alpha b$; границы; $\\{a,b,\\alpha\\}$ и $\\{b,a,\\alpha\\}$, $\\{a,b,\\beta\\}$ не всегда тождественны"}
  - {id: 18-len, kind: definition, label: "§ 28", section: 28, page: 91, statement: "$(l\\{a,b,\\alpha\\} = l\\{c,d,\\alpha\\}) \\dashv\\vdash ((a = \\alpha c) \\leftrightarrow (b = \\alpha d))$; $(l\\{a,b,\\alpha\\} > l\\{c,d,\\alpha\\}) \\dashv\\vdash ((a = \\alpha c) \\to (b > \\alpha d)) \\wedge ((b = \\alpha d) \\to (c > \\alpha a))$; $l\\{a,\\alpha\\}$; бесконечно малые и нулевые — только для абстрактных", errors: ["нет способа измерения ⇒ $lx = 0$"]}
  - {id: 18-abs-row, kind: interpretation, label: "§ 29", section: 29, page: 93, statement: "абстрактный ряд непрерывен е. т. е. между любыми двумя есть третий; правильная интерпретация: непрерывный ↦ непрерывный, точка ↦ элемент, не «пустое место»; при разных образах разных точек интерпретации нет", errors: ["интерпретируются только элементы"]}
  - {id: 18-inf, kind: definition, label: "§ 30", section: 30, page: 95, statement: "конечность: по началу/концу, по числу элементов, по протяжённости; бесконечное число элементов эмпирического ряда ⇒ бесконечная протяжённость; для абстрактного — нет"}
  - {id: 18-str, kind: definition, label: "§ 31", section: 31, page: 96, statement: "структура скопления $A$ относительно класса способов $B$; без $B$ вопрос о структуре не ставится; подструктура, собственная подструктура, объединение, «внутри»", errors: ["скопление есть структура само по себе"]}
  - {id: 18-strE, kind: theorem, label: "§ 32–33", section: 32, page: 100, statement: "структура существует е. т. е. существуют элементы и нужные отношения; протяжённость подструктуры, элемента и индивида внутри не больше протяжённости структуры"}
  - {id: 18-corr, kind: definition, label: "§ 34", section: 34, page: 101, statement: "$a \\Leftarrow b$ для индивидуальных: ${\\sim}(a \\rightleftharpoons b)$ и решение выбирать $b$ вслед за $a$; для общих — через индивидные переменные; $(a \\rightleftharpoons b) \\to {\\sim}(a \\Leftarrow b) \\wedge {\\sim}(b \\Leftarrow a)$", errors: ["предметы соответствуют сами по себе"]}
  - {id: 18-corrK, kind: definition, label: "§ 35", section: 35, page: 103, statement: "$A \\Leftarrow B$: не пересекаются, оба непусты, каждому элементу $A$ — хотя бы один элемент $B$; $A \\langle\\equiv B \\equiv Df. x \\wedge y \\wedge z$; $A \\langle\\equiv\\rangle B$; следствия 1–4", errors: ["соответствие пересекающихся классов"]}
  - {id: 18-pow, kind: axiom, label: "§ 35, 1–9", section: 35, page: 104, statement: "1. $(A \\subset B) \\to (A \\urcorner > mB)$; 2. непустой $>$ пустого; 3. $(A \\langle\\equiv B) \\to (A \\urcorner > mB)$; 4. пересекающиеся — по непересекающимся частям; 5. собственный подкласс во взаимнооднозначном соответствии; 6–8 из 1; 9 из 3"}
  - {id: 18-fun, kind: definition, label: "§ 36, § 39", section: 36, page: 105, statement: "$b \\Leftarrow f(a)$ — общий способ соответствия $Kb$ классу $Ka$; разные способы $f^i$; функциональная связь состояний $s(Rx)y \\Leftarrow f(sx)$ и её условная форма $x \\to (Rx)y^*$"}
  - {id: 18-ordc, kind: rule, label: "§ 37", section: 37, page: 106, statement: "упорядоченные конъюнкции и дизъюнкции $x \\wedge (Rx)y$, $x \\vee (Rx)y$; коммутация только с $(aR^1b) \\to (bR^2a)$", errors: ["коммутация $x \\wedge (Rx)y \\vdash y \\wedge (Ry)x$"]}
  - {id: 18-ordif, kind: rule, label: "§ 38", section: 38, page: 106, statement: "$(x \\to (Rx)y) \\dashv\\vdash (\\forall sx)((Rx)y)$; $(x \\to (R^1x)y) \\wedge ((aR^1b) \\to (bR^2a)) \\vdash ({\\sim}y \\to (R^2{\\sim}y){\\sim}x)$"}
  - {id: 18-conn, kind: definition, label: "§ 40", section: 40, page: 108, statement: "высказывание о связи: $x \\to (Rx)y$ при недоказуемом $x \\to y$ (физическое следование); $x^i \\wedge (sx^i \\in Ksx) \\wedge A \\vdash (Rx^i)y^i$; правила для сложных связей", errors: ["правило $A$ как логическое"]}
  - {id: 18-kl, kind: method, label: "§ 41", section: 41, page: 109, statement: "термины чисел общие; $K$нч и $K$чч не во взаимнооднозначном соответствии ($K$чч $\\subset K$нч); верно: для всех непересекающихся $\\alpha$, $\\beta$ — взаимнооднозначное соответствие; классы-эталоны"}
  # Дополнение проверяющего V18 (пункты книги, которых не было отдельными записями), принято исправителем F18:
  - {id: 18-K-ax1, kind: axiom, label: "§ 6", section: 6, page: 61, statement: "первая из схем для $K$ и $\\in$: $(\\exists a)(a \\in Kb) \\vdash (\\exists b)(b \\in Ka)$ (в 18-K-ax перечислены только три остальные)"}
  - {id: 18-sub-neg, kind: definition, label: "§ 6", section: 6, page: 62, statement: "$(\\exists a)(((a \\in A) \\wedge {\\sim}(a \\in B)) \\vee ((a \\in B) \\wedge {\\sim}(a \\in A))) \\dashv\\vdash {\\sim}(A \\subset B)$; $(\\forall a)(a \\in A) \\dashv\\vdash (Ka \\subset A)$ для индивидной $a$", errors: ["${\\sim}(A \\subset B)$ как «$A$ и $B$ не пересекаются»"]}
  - {id: 18-skop-ind, kind: definition, label: "§ 7", section: 7, page: 64, statement: "термин скопления $A$ индивидуален, если относительно любого индивида известно, включается ли он в $A$; $a \\in B$, $A \\subset B$ для скоплений"}
  - {id: 18-E-ind, kind: interpretation, label: "§ 9", section: 9, page: 65, statement: "для индивидуальных $a$ смысл $E(a)$, $\\urcorner E(a)$, $?E(a)$ разъясняется: 1) наблюдение (непосредственно, по следам, свидетельства); 2) доказательство из других данных; неопределённость — невозможно установить ни наблюдением, ни рассуждением"}
  - {id: 18-E-skop, kind: definition, label: "§ 9", section: 9, page: 68, statement: "три случая существования скоплений: по перечню ($E(a) \\equiv Df.E(b^1) \\wedge … \\wedge E(b^m)$), по числу, при неопределённом составе — для индивидуального $a$ через $(\\exists I)E(I \\downarrow (I \\in a))$, для общего — как для родовых терминов"}
  - {id: 18-M-enka, kind: definition, label: "§ 11", section: 11, page: 71, statement: "$M$ для энок и скоплений — как $E$ с заменой $E$ на $M$: $M(a^1, …, a^n) \\equiv Df.M(a^1) \\wedge … \\wedge M(a^n)$"}
  - {id: 18-M-time, kind: method, label: "§ 11", section: 11, page: 71, statement: "$x \\to M(sx)$ — бесспорный случай; для несуществующих индивидуальных $sx$: время $t^1$ высказывания, $t^2$ — время состояния; прошедшее сводится к будущему переносом ситуации в $t^3$, предшествующее $t^2$ (пример «Наполеон мог выиграть битву при Ватерлоо»)"}
  - {id: 18-C-q, kind: definition, label: "§ 12", section: 12, page: 72, statement: "$?C(sx) \\equiv Df.C(sx) \\wedge {\\sim}\\urcorner C(sx)$ (в записи книги)"}
  - {id: 18-p-cond, kind: axiom, label: "§ 16", section: 16, page: 76, statement: "для оператора условности: $\\vdash (x \\to y) \\to (p(y) \\leqslant p(x))$; $\\vdash x \\to (p(x \\to y) = p(y))$"}
  - {id: 18-p-stat, kind: interpretation, label: "§ 16", section: 16, page: 77, statement: "«вероятность высказывания»: 1) вероятность обнаружить существование $sx$ — состояние $sy$, правило $p(y) \\leqslant p(x)$; 2) вероятность того, что мы правы, утверждая $x$ (обстоятельства за и против)"}
  - {id: 18-ord-emp, kind: definition, label: "§ 19", section: 19, page: 81, statement: "логический аспект (одно время $t^1$, $\\vdash {\\sim}(x \\wedge {\\sim}x)$) и эмпирический аспект ($t^1$, $t^2$; возможны ${\\sim}(a(R^1\\alpha)b)$ и $a?(R^1\\alpha)b$ без $a \\urcorner (R^1\\alpha) b$); выбор, что есть $> \\alpha$, а что $< \\alpha$, не предрешён"}
  - {id: 18-betw-gen, kind: definition, label: "§ 20", section: 20, page: 82, statement: "общее «между» для $b^1, …, b^n$ и способов $\\alpha^1, …, \\alpha^m$: для любой пары $b^i$, $b^k$ найдётся $\\alpha^j$, что $(a > \\alpha^j b^i) \\wedge (b^k > \\alpha^j a)$ или $(b^i > \\alpha^j a) \\wedge (a > \\alpha^j b^k)$"}
  - {id: 18-touch-cons, kind: theorem, label: "§ 24", section: 24, page: 87, statement: "следствия определения: $(a = \\alpha b) \\vdash {\\sim}(a \\parallel \\alpha b)$; развёртка ${\\sim}(a \\parallel \\alpha b)$; $(a \\parallel \\alpha b) \\vdash (a \\mid \\alpha b)$; замена $\\mathrm{M}$ на $\\exists$ без оператора $\\mathrm{M}$"}
  - {id: 18-corrK-cons, kind: theorem, label: "§ 35", section: 35, page: 103, statement: "следствия определения $A \\Leftarrow B$: 1) пустой класс; 2) пересекающиеся; 3) $A \\subset B$ — ${\\sim}(A \\Leftarrow B) \\wedge {\\sim}(B \\Leftarrow A)$; 4) ${\\sim}(A \\Leftarrow A)$; формулы $y$ и $z$ (с. 103)"}
  - {id: 18-pow-25, kind: axiom, label: "§ 35, 2, 4, 5", section: 35, page: 104, statement: "2. непустой класс превосходит по мощности пустой; 4. отношение мощностей пересекающихся классов — по непересекающимся частям; 5. при $x$: $A > mB$ е. т. е. найдётся собственный подкласс $C$ класса $A$, $C \\langle\\equiv\\rangle B$"}
  - {id: 18-funsv, kind: definition, label: "§ 39", section: 39, page: 107, statement: "условие подбора $f$: $\\vdash (s(Rx)y \\Leftarrow f(sx)) \\wedge x^i \\to (Rx^i)y^i$ для любых $x^i$, $y^i$ с $sx^i \\rightharpoonup sx$, $sy^i \\rightharpoonup sy$; способ соответствия классов навязывается связью"}
