# Модули учебного плана (docs/07-uchebnyj-plan.md). chapters — номера глав и разделов.
modules:
  - name: "I. Язык логики"
    chapters: [0]
    goal: "Безошибочно отличать субъекты, предикаты, высказывания и формулы следования. Находить главный оператор, определять вхождение, читать любую запись книги и записывать в символах обычные фразы."
  - name: "II. Сильное следование"
    chapters: [1, 2]
    goal: "Строить выводы в S¹. Сразу видеть «парадоксальные» следствия. Вычислять значения по главной интерпретации. Понимать, как доказываются непротиворечивость, полнота и независимость."
  - name: "III. Виды следования и общая теория дедукции"
    chapters: [3, 4, 5]
    goal: "Различать сильное, ослабленное, максимальное, конверсное, вырожденное следование и квазиследование. Для любой формулы определять, в какой из систем она верна. Сравнивать их с классической и интуиционистской логикой."
  - name: "IV. Координаты высказываний"
    chapters: [16]
    goal: "Отличать локальные высказывания от универсальных. Применять правила теории координат. Замечать в рассуждении, что сменились место, время или условия."
  - name: "V. Условные высказывания и кванторы"
    chapters: [6, 7]
    goal: "Не путать «если…, то» со следованием и с материальной импликацией. Строить выводы в системах кванторов для классического и неклассического случаев. Различать две формы отрицания при кванторах."
  - name: "VI. Предикация, термины, классы"
    chapters: [8, 9, 10]
    goal: "Работать с силлогистикой предикатов и классов. Проверять определения. Разбирать парадокс класса нормальных классов."
  - name: "VII. Существование, модальности, отношения, нормы"
    chapters: [11, 12, 13, 14]
    goal: "Корректно рассуждать о существовании, возможности, порядке, изменении, нормах. Видеть физическое следование там, где его выдают за логическое."
  - name: "VIII. Семантика и итоговое повторение"
    chapters: [15]
    goal: "Приписывать значения формулам с кванторами по правилам Приложения. Решать смешанные задачи на весь курс."
  - name: "IX. Логическая физика"
    chapters: [18, 19]
    goal: "Логически корректно употреблять термины пространства, времени, изменения, движения, связи и причины по «Логической физике»: отличать следствия из определений терминов от физических утверждений, разбирать парадоксы движения и связей."
