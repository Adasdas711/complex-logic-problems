# Глава 3 «Ослабленное следование» (с. 49–58). Составлено проверяющим V02 по изображениям страниц.
skills:
  # § 1 Система S² (с. 49)
  - {id: 03-S2, kind: definition, label: "S² § 1", section: 1, page: 49, statement: "S² = схемы S¹ (A1–A14, с. 15–17) + A15 + ограниченное R1; теория ослабленного следования: доказуемы x ⊢ y с элементарными высказываниями заключения, отсутствующими в посылке", errors: ["считать S² расширением S¹ без ограничения R1"]}
  - {id: 03-A15, kind: axiom, label: A15, section: 1, page: 49, statement: "∼x ⊢ ∼(xy)", errors: ["путать с ∼(xy) ⊢ ∼x", "A15 как теорема S¹"]}
  - {id: 03-R1r, kind: rule, label: "R1 (ограничение Г. А. Смирнова)", section: 1, page: 49, statement: "из x ⊢ y и y ⊢ z — x ⊢ z, если в x, y и z входит по крайней мере одно одинаковое элементарное высказывание", errors: ["проверять общее высказывание попарно, а не у трёх", "применять R1 без проверки ограничения"]}
  - {id: 03-cons-ind, kind: metatheorem, label: "§ 1", section: 1, page: 49, statement: "непротиворечивость S²: все примеры A15 — тавтологии; независимость A15: единственная схема, допускающая в заключении новые элементарные высказывания"}
  # § 2 Непарадоксальность S² (с. 49–50)
  - {id: 03-MT1-2, kind: metatheorem, label: "MT1 § 2", section: 2, page: 49, statement: "если x ⊢ y доказуема в S², то в x и y есть одинаковое элементарное высказывание; доказательство разбором четырёх случаев (аксиома, R1, R2, R3)", errors: ["обращение MT1", "в случае R1 забыть ограничение"]}
  - {id: 03-par, kind: method, label: "§ 2, с. 50", section: 2, page: 50, statement: "недоказуемы ∼xx ⊢ y, x ⊢ y : ∼y, x ⊢ y ∨ ∼y, x ⊢ ∼(∼yy); x ⊢ (y ⊢ x), x ⊢ (∼x ⊢ y) — не формулы следования S²", errors: ["тавтологичность как достаточное условие доказуемости в S²"]}
  # § 3 Полнота S² (с. 50–52)
  - {id: 03-T1-2-3, kind: theorem, label: "T1, T2 § 3", section: 3, page: 50, statement: "T1 x ⊢ x(y : ∼y) [A15, R2]; T2 x(y : ∼y) ⊢ x [A2]"}
  - {id: 03-D1-3, kind: definition, label: "D1 § 3", section: 3, page: 50, statement: "каноническая форма x** ⊢ y**: x** — каноническая форма x*(z : ∼z), y** — каноническая форма y*v(w : ∼w)", errors: ["не добавить к y* множитель v из ∼aⁱaⁱ", "включить в w высказывания, входящие в x* вместе с отрицанием"]}
  - {id: 03-MT1-3, kind: metatheorem, label: "MT1 § 3", section: 3, page: 51, statement: "для тавтологии с общим элементарным высказыванием есть каноническая форма x** ⊢ y** — тавтология с совпадающими множествами элементарных высказываний; два случая: ∼x не тавтология / тавтология"}
  - {id: 03-MT2-3, kind: metatheorem, label: "MT2, MT3 § 3", section: 3, page: 52, statement: "x ⊢ y доказуема в S² е. т. е. доказуема её каноническая форма (A13, A3, R2, T10 гл. 1 § 2, T1, T2, R3, R1, MT1 гл. 1 § 7); тавтология в канонической форме с общим высказыванием доказуема"}
  - {id: 03-MT4-3, kind: metatheorem, label: "MT4 § 3", section: 3, page: 52, statement: "полнота: тавтология с общим элементарным высказыванием доказуема в S²; вместе с MT1 § 2 — критерий доказуемости", errors: ["критерий S^s вместо критерия S^w"]}
  # § 4 Система S₂ (с. 52–53)
  - {id: 03-S2w, kind: definition, label: "S₂ § 4", section: 4, page: 52, statement: "S₂ получается из S₁ так же, как S² из S¹: дополнительная схема A12 (в доказательстве с. 54 применяется как x ⊢ x ∨ y), ограниченное R1", errors: ["нумеровать дополнительную схему S₂ как A15"]}
  - {id: 03-A12w, kind: axiom, label: "A12 S₂", section: 4, page: 52, statement: "x ⊢ x ∨ y (вид, в котором схема применяется на с. 54)"}
  - {id: 03-compl-S2w, kind: metatheorem, label: "§ 4, с. 53", section: 4, page: 53, statement: "полнота S₂ (Федина): доказательство полноты S₁ (MT1–MT5 § 2 гл. 2) сохраняет силу, MT1 дополняется сомножителями (qⁱ ∨ ∼qⁱ); из полноты S² и S₂ — их эквивалентность"}
  # § 5 Системы Sʷ (с. 53–54)
  - {id: 03-Sw, kind: definition, label: "Sʷ § 5", section: 5, page: 53, statement: "Sʷ — S², S₂ и эквивалентные им системы"}
  - {id: 03-S2star, kind: definition, label: "S₂*, S₂** § 5", section: 5, page: 53, statement: "S₂* — из S₁* снятием ограничения на R*4 и ограничением R1; S₂** — из S₁** без A8, без ограничения на R**3, с ограниченным R1; в S₂** R3 не основное"}
  - {id: 03-ind-S2w, kind: method, label: "§ 5, с. 53–54", section: 5, page: 53, statement: "A8 не независима в S₂ (как в S₁*); независимость A12 — единственная схема с новым высказыванием справа; прочие схемы — как в S₁; S₂* — как S₁*, S₂** — интерпретациями S₁**"}
  - {id: 03-A8-der, kind: theorem, label: "вывод A8 в S₂, с. 54", section: 5, page: 54, statement: "вывод xz ∨ yz ⊢ (x ∨ y)z в 17 шагов (A3, A1, A2, A12, A9, A10, A4, R1, R2) с соблюдением ограничения R1"}
  # § 6 Системы, сходные с Sʷ (с. 54–58)
  - {id: 03-Ack, kind: method, label: "§ 6, с. 54–55", section: 6, page: 54, statement: "системы Аккермана, Андерсона и Белнапа (один знак сильной импликации как знак следования) непарадоксальны, но неполны в смысле Sʷ: цепочка ∼xx → ∼xx ∨ ∼xy → ∼x(x ∨ y) → y; недоказуема ∼x(x ∨ y) → y; система Бобровой", errors: ["считать, что Sʷ избегает парадокса недоказуемостью ∼x(x ∨ y) ⊢ y"]}
  - {id: 03-S21, kind: definition, label: "S₂¹ § 6", section: 6, page: 55, statement: "S₂¹ (Сидоренко): A1–A10 S₁; R1 x ⊢ y ⇒ ∼y ⊢ ∼x; R2 транзитивность; R3 x ⊢ y, z ⊢ v ⇒ x ∨ z ⊢ y ∨ v; R2, R3 S₁ — производные R*4, R*5; теорема x ⊢ x ∨ y", errors: ["нумерация правил как в S₁"]}
  - {id: 03-DNF, kind: definition, label: "ДНФ § 6", section: 6, page: 56, statement: "x¹ ∨ … ∨ xⁿ (n ≥ 1) в ДНФ: каждое xⁱ — конъюнкция элементарных высказываний и их отрицаний (конъюнктивных составляющих); x приводится к ДНФ y, если x ⊣⊢ y доказуемы"}
  - {id: 03-MT1-2-6, kind: metatheorem, label: "MT1, MT2 § 6", section: 6, page: 56, statement: "критерий: x ⊢ y доказуема в S₂¹ е. т. е. для каждого xⁱ ДНФ посылки найдётся yʲ ДНФ заключения, все конъюнктивные составляющие которого входят в xⁱ (xⁱ ⊢ yʲ — тавтология)", errors: ["отождествлять p и ∼p как составляющие", "тавтологичности формулы достаточно"]}
  - {id: 03-Rs6, kind: rule, label: "R*6 § 6", section: 6, page: 57, statement: "производное правило: в x ⊢ y в ДНФ на место конъюнктивных составляющих подставляются любые высказывания, вместо элементарного высказывания и его отрицания — разные"}
  - {id: 03-MT3-6, kind: metatheorem, label: "MT3 § 6", section: 6, page: 57, statement: "если R*6 принять как основное, присоединение любой недоказуемой формулы позволяет доказать любую a ⊢ b; доказательство через член xⁱ без подходящего yʲ, A3, ac ∨ bc ⊢ (a ∨ b)c, R2"}
