# Глава 5 «Общая теория дедукции» (с. 72–81). Составлено проверяющим V04 по изображениям страниц.
skills:
  - {id: 05-1, kind: definition, label: "§ 1", section: 1, page: 72, statement: "системы гл. 1–4 образуют общую теорию дедукции; прочие разделы строятся присоединением алфавита, определений, схем и правил"}
  - {id: 05-MT1-6, kind: metatheorem, label: "MT1–MT6 § 2", section: 2, page: 72, statement: "критерии Sˢ (B⊆A), Sᵐ (A=B), Sʷ (A∩B≠∅), Sᶜ (A⊆B), S⁵ (⊢x — тавтология), S⁶ (x ⊃ y доказуема классически)", errors: ["условие Sˢ и Sᶜ переставлены", "условие Sᵐ приписано Sʷ"]}
  - {id: 05-nonformula, kind: definition, label: "§ 2, с. 73", section: 2, page: 73, statement: "выражения с двумя и более ⊢ — не формулы следования; S⁶ не совпадает с классическим исчислением", errors: ["MT6 применяют к выражению с несколькими ⊢"]}
  - {id: 05-nonparadox, kind: theorem, label: "§ 2, с. 73", section: 2, page: 73, statement: "в Sˢ, Sʷ, Sᵐ, Sᶜ недоказуемы x ⊢ ∼(∼yy), ∼xx ⊢ y, x ⊢ y∨∼y (нет общих элементарных высказываний)"}
  - {id: 05-AB, kind: definition, label: "§ 3, формулы вида A и B", section: 3, page: 74, statement: "A: x ⊢ x:∼x, x ⊢ x∨∼x, ∼xx ⊢ x — доказуемы; B: x ⊢ y:∼y, x ⊢ y∨∼y, ∼xx ⊢ y — недоказуемы; A получаются не из B; узкие исчисления — перечнем или структурными признаками", errors: ["подстановка в недоказуемую формулу переносит недоказуемость"]}
  - {id: 05-intuit, kind: theorem, label: "§ 4", section: 4, page: 75, statement: "интуиционистски доказуемы x⊃(y⊃x), x⊃(∼x⊃y), ∼xx⊃y, y⊃x∨∼x, недоказуемы ∼∼x⊃x, ∼x∨x; как система следования — неполна и парадоксальна"}
  - {id: 05-n-def, kind: definition, label: "§ 5, дополнение к определению высказывания", section: 5, page: 76, statement: "⌝ и ? только перед главным оператором ∀, ∃, ←, →; Sⁱₙ = Sⁱ + Aⁿ1–Aⁿ6", errors: ["⌝ или ? перед ·, :, ∨, ∼"]}
  - {id: 05-An1-6, kind: axiom, label: "Aⁿ1–Aⁿ6", section: 5, page: 76, statement: "∼x ⊢ ⌝x∨?x; ⌝x∨?x ⊢ ∼x; ∼⌝x ⊢ x∨?x; x∨?x ⊢ ∼⌝x; ∼?x ⊢ x∨⌝x; x∨⌝x ⊢ ∼?x", errors: ["Aⁿ3 и Aⁿ4 переставлены"]}
  - {id: 05-n-int, kind: interpretation, label: "главная интерпретация ⌝ и ?", section: 5, page: 76, statement: "x и ⌝x не истинны вместе; оба могут быть ложны; ?x равнозначно ∼x∼⌝x"}
  - {id: 05-MT1-3-5, kind: metatheorem, label: "MT1–MT3 § 5", section: 5, page: 76, statement: "теоремы Sⁱₙ — тавтологии; непарадоксальность; ∼⌝x ⊢ x и ⊢ x∨⌝x недоказуемы"}
  - {id: 05-T1-14, kind: theorem, label: "T1–T14 § 5", section: 5, page: 77, statement: "x ⊣⊢ ∼⌝x∼?x; x ⊢ ∼⌝x; …; ⊢ x∨⌝x∨?x"}
  - {id: 05-An7, kind: axiom, label: "Aⁿ7", section: 5, page: 77, statement: "классический случай: исключить дополнения или принять ∼x ⊢ ⌝x", errors: ["Aⁿ7 в неклассической системе"]}
  - {id: 05-D1-6, kind: definition, label: "D1 § 6", section: 6, page: 77, statement: "y¹…yᵐ не расширяют числа возможностей по x¹…xⁿ ⇔ ⊢∼(x¹:…:yᵐ) или x¹:…:yᵐ ⊢ x₁:…:xₖ", errors: ["«не противоречие» достаточно для расширения"]}
  - {id: 05-MT1-8-6, kind: metatheorem, label: "MT1–MT8 § 6", section: 6, page: 77, statement: "MT1 монотонность; MT2–MT3 xy, ∼xy, … не расширяют; MT4 ∼x∼y расширяет; MT5–MT6 предельность; MT7 по x и ∼x невозможно; MT8 ∼x∼⌝x"}
  - {id: 05-D2-3-6, kind: definition, label: "D2, D3, MT9, MT10 § 6", section: 6, page: 79, statement: "классическое отношение: ⊢ x:y; неклассическое: ⊢ x:y:∼x∼y, но не ⊢ x:y", errors: ["несовместимость принимают за классическое отношение"]}
  - {id: 05-7, kind: method, label: "§ 7", section: 7, page: 79, statement: "разделы логики — дополнения к выбранной системе общей теории дедукции; от выбора зависят системы"}
  - {id: 05-8, kind: interpretation, label: "§ 8", section: 8, page: 80, statement: "интерпретация через тавтологичность x ⊃ y — «техническая»; достаточная: x ⊢ y = 1 ⇔ приписав x 1, вынуждены приписать y 1; условия истинности — наличие логического правила", errors: ["одного набора с истинными частями достаточно"]}
  - {id: 05-9-op, kind: method, label: "§ 9, операция замены отрицаний", section: 9, page: 81, statement: "применима, если x — противоречие или y — тавтология; пп. 1–4", errors: ["заменяют отрицание буквы, не входящей без отрицания", "не снимают двойные отрицания", "не заменяют сильную дизъюнкцию"]}
  - {id: 05-9-compl, kind: definition, label: "§ 9, достаточная полнота", section: 9, page: 81, statement: "доказуемы все непарадоксальные тавтологии, у которых x** ⊢ y** доказуемы; S₂¹ неполна: (x∨y)∼x ⊢ y"}
