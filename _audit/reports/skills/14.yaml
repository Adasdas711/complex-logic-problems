# Гл. 14 «Нормативные предикаты» (с. 189–191). Схемы переписаны с изображений страниц.
skills:
  - {"id": "14-def", "kind": "definition", "label": "с. 189", "section": 0, "page": 189, "statement": "нормативные высказывания: субъекты — названия действий, предикаты O, P, З, Б, Н; на них распространяются общие правила логики"}
