  - {"id": "14-types", "kind": "definition", "label": "с. 190", "section": 0, "page": 190, "statement": "по AI O и P дедуктивно связаны (O категорически сильнее); по AII, AIII, AV — логически взаимозаменимы O и P, З и P, Н и O; Б определяется через P (AIV)"}
  - {"id": "14-cl", "kind": "method", "label": "S^n_c", "section": 0, "page": 190, "statement": "исключить всё, что связано с ?, заменить ¬ на ∼; схемы S^n_c 1–6"}
  - {"id": "14-quant", "kind": "definition", "label": "с. 191", "section": 0, "page": 191, "statement": "нормативные предикаты неявно предполагают кванторы: «действие a разрешено» = «всякое действие, называемое a, разрешено»"}
