# Раздел 16 «Координаты высказываний». Источники (по изображениям страниц):
#   «Очерки комплексной логики» (2000), Разд. VIII, гл. 1, § 17 (с. 352–353; PDF 357–358), § 28 (с. 372–375; PDF 377–380);
#   «Logische Sprachregeln», Kap. 14, § 3 «Lokale und universale Aussagen» (с. 496–497; PDF 500–501).
# section — параграф раздела 16 по toc.yaml (1 — локальные/универсальные, тождество координат; 2 — язык ТЛК;
# 3 — аксиомные схемы I–VI; 4 — определения локальности/универсальности, неопределённость; 5 — условия; 6 — диагностика).
skills:
  - {id: 16-local17, kind: definition, label: "§ 17", section: 1, page: 352, source: "Очерки",
     statement: "локальные высказывания — значения истинности зависят от места и времени употребления («Окно открыто»); сюда же — зависимость от индивидов (смена индивида есть смена области пространства или времени) и от условий (смена условий предполагает смену места или другое время)",
     errors: ["зависимость от индивида или условий считают не связанной с координатами", "локальность смешивают с ложностью"]}
  - {id: 16-coord-def, kind: definition, label: "§ 17", section: 1, page: 352, source: "Очерки",
     statement: "координаты высказывания x — место, время, условия и т. п., в которых используется x и устанавливается его значение истинности; обычно предполагаются неявно, иногда не играют роли, иногда фиксируются особыми знаками; при формулировке и применении правил логики надо предполагать, что они могут быть учтены",
     errors: ["раз координаты не названы, их нет", "координаты считают частью предиката или субъекта без оговорки"]}
  - {id: 16-identity, kind: rule, label: "§ 17", section: 1, page: 352, source: "Очерки",
     statement: "в «Если P(a), то Q(a)» при локальности входящих высказываний соблюдается тождество координат для P(a) и Q(a) (выбран индивид b — тот же и во втором); из истинности x и y можно признать истинным x ∧ y лишь при тождестве координат для x, y и x ∧ y (если x и y локальны)",
     errors: ["соединяют в конъюнкцию высказывания с разными координатами («одновременно»)", "в условном высказывании берут разных индивидов"]}
  - {id: 16-nolink17, kind: definition, label: "§ 17", section: 1, page: 353, source: "Очерки",
     statement: "между координатами α и высказыванием x никакой логической связи не предполагается; координаты — обособившаяся часть высказывания, оперировать надо высказыванием «x при α»",
     errors: ["из x выводят его координаты («окно открыто — значит, сейчас 1990 год»)"]}
  - {id: 16-universal17, kind: definition, label: "§ 17", section: 1, page: 353, source: "Очерки",
     statement: "универсальные высказывания — значения истинности не меняются с изменением координат (одно и то же значение в любых координатах); примеры: «Все чётные числа делятся на два без остатка», «Электрон заряжен отрицательно», «5 > 3», «Человек смертен»",
     errors: ["универсальное = истинное", "универсальность устанавливают по одному-двум случаям"]}
  - {id: 16-sciences, kind: interpretation, label: "§ 17", section: 1, page: 353, source: "Очерки",
     statement: "с учётом корректив о координатах правила логики в одинаковой мере относятся к универсальным и локальным; универсальные характерны для точных наук (координаты безразличны, ссылки на них опускаются), локальные — для опытных наук, где выявление координат играет существенную роль",
     errors: ["правила логики считают применимыми только к универсальным высказываниям"]}
  - {id: 16-LSR-D1, kind: definition, label: "LSR, D1", section: 1, page: 496, source: "LSR",
     statement: "lokale (universale) Aussagen — высказывания, значения истинности которых меняются (не меняются) в зависимости от изменения их координат; пример «Das Fenster ist offen»"}
  - {id: 16-LSR-laws, kind: rule, label: "LSR, § 3", section: 1, page: 496, source: "LSR",
     statement: "законы логики универсальны (для любых координат состояний), но координаты неявно предполагаются: правило A ⊢ A предполагает тождество координат посылки и следствия, A α ⊢ A α; A α ⊢ A β не есть логический закон",
     errors: ["из Aα выводят Aβ («утром идёт дождь — значит, и вечером»)"]}
  - {id: 16-LSR-nolink, kind: definition, label: "LSR, § 3", section: 1, page: 497, source: "LSR",
     statement: "между высказыванием A и его координатами α нет логической связи: в общем случае не предполагается ни α → A, ни ∼α → ∼A",
     errors: ["α → A («в Москве — значит, идёт дождь»)"]}
  - {id: 16-LSR-TR1, kind: rule, label: "LSR, TR1", section: 2, page: 496, source: "LSR",
     statement: "если a — термин, α — знак координат, то aα — термин той же категории (субъект → субъект, предикат → предикат)",
     errors: ["aα для предиката a считают субъектом"]}
  - {id: 16-LSR-TR2, kind: rule, label: "LSR, TR2", section: 2, page: 496, source: "LSR",
     statement: "если A — высказывание, то Aα — высказывание"}
  - {id: 16-LSR-AK, kind: axiom, label: "LSR, A^K", section: 3, page: 496, source: "LSR",
     statement: "A^K: Aα ⊣⊢ B, где B получается из A заменой всех вхождений входящих высказываний B¹,…,Bⁿ на B¹α,…,Bⁿα, или всех субъектов a¹,…,aᵐ на a¹α,…,aᵐα, или всех предикатов P¹,…,Pᵏ на P¹α,…,Pᵏα",
     errors: ["заменяют не все вхождения", "смешивают в одном B замену высказываний и замену терминов"]}
  - {id: 16-xa, kind: definition, label: "§ 28", section: 2, page: 372, source: "Очерки",
     statement: "если x — высказывание (термин), α — языковое выражение, обозначающее область пространства или интервал времени (или то и другое), то «x в α» — высказывание (термин), [xα]; α — координаты x; в [xα] x «связано координатами α»; логической связи между x и α нет (не исключена как частный случай)",
     errors: ["[xα] считают конъюнкцией x и α"]}
  - {id: 16-xy, kind: definition, label: "§ 28", section: 2, page: 373, source: "Очерки",
     statement: "если x — высказывание или термин, y — высказывание, то «x при y» ([xy]) — высказывание (термин); y — условие x; из [xy] (x — высказывание) логически не следуют x → y и y → x; для термина x отсутствие связи очевидно",
     errors: ["из [xy] выводят y → x", "условием делают термин"]}
  - {id: 16-alphabet, kind: definition, label: "§ 28, алфавит ТЛК", section: 2, page: 373, source: "Очерки",
     statement: "ТЛК — дополнение к ОТД и ОТТ; переменные: s, s¹, s²,… — пространственные координаты; t, t¹,… — временные; u, u¹,… — условные; v, v¹,… — любые координаты и их комбинации",
     errors: ["v считают только временной координатой", "u путают с пространственной"]}
  - {id: 16-formation, kind: definition, label: "§ 28", section: 2, page: 373, source: "Очерки",
     statement: "если x — пропозициональная формула, k — переменная для координат, то [xk] — пропозициональная формула; если a — терминная форма, то [ak] — терминная форма",
     errors: ["[ak] считают высказыванием"]}
  - {id: 16-I, kind: axiom, label: "I.1–I.3", section: 3, page: 373, source: "Очерки",
     statement: "I.1 ⊢ (x ⊢ y) ↔ ([xv] ⊢ [yv]); I.2 ⊢ (x ⊢ y) ↔ (∀v)(x ⊢ y); I.3 ⊢ (⊢ x) ↔ (∀v)(⊢ x)",
     errors: ["из x ⊢ y выводят [xv¹] ⊢ [yv²]"]}
  - {id: 16-II, kind: axiom, label: "II.1–II.4", section: 3, page: 373, source: "Очерки",
     statement: "II.1 [[xt¹]t²] ⊣⊢ [xt¹]; II.2 [[xs¹]s²] ⊣⊢ [xs¹]; II.3 [[xs]t] ⊣⊢ [[xt]s]; II.4 [[xv¹]v²] ⊣⊢ [xv¹v²]",
     errors: ["в II.1, II.2 оставляют внешнюю координату", "II.1 применяют к координатам разных видов"]}
  - {id: 16-III, kind: axiom, label: "III.1–III.3", section: 3, page: 373, source: "Очерки",
     statement: "для терминов: III.1 ⊢ [[at¹]t²] ⇌ [at¹]; III.2 ⊢ [[as¹]s²] ⇌ [as¹]; III.3 ⊢ [[as]t] ⇌ [[at]s]",
     errors: ["для терминов пишут ⊣⊢ вместо ⇌"]}
  - {id: 16-IV, kind: axiom, label: "IV.1–IV.4", section: 3, page: 374, source: "Очерки",
     statement: "IV.1 (∃a)x ⊢ (∃v)[xv]; IV.2 (∀v)[xv] ⊢ (∀a)x; IV.3 (∃v)[xv] ⊢ (∃v)x; IV.4 (∀v)[xv] ⊢ (∀v)x",
     errors: ["обращают IV.1 или IV.2", "из [xv] выводят (∀v)[xv]"]}
  - {id: 16-V1-4, kind: axiom, label: "V.1–V.4", section: 3, page: 374, source: "Очерки",
     statement: "V.1 [(x ∧ y)v] ⊣⊢ [xv] ∧ [yv]; V.2 [(x ∨ y)v] ⊣⊢ [xv] ∨ [yv]; V.3 [(x → y)v] ⊣⊢ [xv] → [yv]; V.4 [(∼x)v] ⊣⊢ ∼[xv]",
     errors: ["координату переносят только на один член", "в V.1 ставят ∨", "в V.4 теряют ∼"]}
  - {id: 16-V5-8, kind: axiom, label: "V.5–V.8", section: 3, page: 374, source: "Очерки",
     statement: "V.5 [((αЖa)x)v] ⊣⊢ (αЖa)[xv]; V.6 (αЖa)[xv] ⊣⊢ (αЖ[av])x; V.7 [αP(b)v] ⊣⊢ α[Pv](b); V.8 [αP(b)v] ⊣⊢ αP([bv]); α — наличие ¬ или ? или отсутствие обоих, Ж — ∀ или ∃",
     errors: ["в V.5–V.6 меняют квантор", "теряют знак α (¬ или ?)"]}
  - {id: 16-VI, kind: axiom, label: "VI.1–VI.3", section: 3, page: 374, source: "Очерки",
     statement: "VI.1 (u → x) ⊢ [xu]; VI.2 (∃↓u)x ⊣⊢ (∃s)(∃t)x; VI.3 (∀↓u)x ⊣⊢ (∀s)(∀t)x",
     errors: ["обращают VI.1: [xu] ⊢ u → x"]}
  - {id: 16-noncontr, kind: theorem, label: "с. 374", section: 3, page: 374, source: "Очерки",
     statement: "[Pv¹](a) ∧ ∼[Pv²](a), [xv¹] ∧ ∼[xv²], (∀[av¹])x ∧ ∼(∀[av²])x не являются противоречиями; [Pv¹](a) ∨ ∼[Pv²](a), [xv¹] ∨ ∼[xv²], (∀[av¹])x ∨ ∼(∀[av²])x не являются тавтологиями",
     errors: ["«противоречат друг другу» при разных координатах", "закон исключённого третьего при разных координатах"]}
  - {id: 16-D-local, kind: definition, label: "с. 374", section: 4, page: 374, source: "Очерки",
     statement: "x локально, если и только если (∃v)x ∧ (∃v)∼x",
     errors: ["локально, если хотя бы при одних координатах истинно"]}
  - {id: 16-D-univ, kind: definition, label: "с. 374", section: 4, page: 374, source: "Очерки",
     statement: "x универсально, если и только если (∀v)x ∨ (∀v)∼x",
     errors: ["универсально только при (∀v)x (забывают (∀v)∼x)"]}
  - {id: 16-nonlocal, kind: theorem, label: "с. 374", section: 4, page: 374, source: "Очерки",
     statement: "из нелокальности не следует универсальность: ∼((∃v)x ∧ (∃v)∼x) ⊣⊢ ((∀v)x ∨ (∀v)∼x) ∨ ((?∀v)x ∨ (?∀v)∼x)",
     errors: ["«не локально, значит универсально»"]}
  - {id: 16-nonuniv, kind: theorem, label: "с. 374", section: 4, page: 374, source: "Очерки",
     statement: "из неуниверсальности не следует локальность: ∼((∀v)x ∨ (∀v)∼x) ⊣⊢ ((∃v)x ∧ (∃v)∼x) ∨ ((?∃v)x ∧ (?∃v)∼x)",
     errors: ["«не универсально, значит локально»"]}
  - {id: 16-indeterminate, kind: interpretation, label: "с. 375", section: 4, page: 375, source: "Очерки",
     statement: "нельзя сказать ни что x локально, ни что универсально, когда ((?∀v)x ∨ (?∀v)∼x) ∧ ((?∃v)x ∧ (?∃v)∼x); для эмпирических наук эта неопределённость сохраняется, для дедуктивных исключается",
     errors: ["неопределённость считают третьим «видом» высказываний наряду с истинными и ложными"]}
  - {id: 16-cond-rule, kind: rule, label: "с. 375", section: 5, page: 375, source: "Очерки",
     statement: "для условий имеют силу правила, аналогичные правилам для координат пространства и времени; [xu¹u²] ⊣⊢ [xu¹] имеет силу без исключения; видимость неправомерности — от смешения с [x(u¹ ∧ u²)] ⊣⊢ [xu¹], которое неправомерно в общем случае (правильно, если u² есть u¹ или из u¹ следует u²)",
     errors: ["отбрасывают член конъюнкции условий («второе условие можно отбросить»)", "считают неправомерным [xu¹u²] ⊣⊢ [xu¹]"]}
  - {id: 16-new-rule, kind: method, label: "с. 375", section: 5, page: 375, source: "Очерки",
     statement: "условия и координаты различают ради новых правил, отличных от правил 1–8; пример: ⊢ (∃a)x → (∃↓u)(∀a)M(↓[xu]) (a — переменная для эмпирических индивидов, свободно входящая в x; M — «возможно»); вывод «В некоторых условиях любой человек может стать императором России» лишь кажется парадоксальным: возможность далеко не всегда реализуется",
     errors: ["возможность при условиях читают как действительность", "a берут связанной"]}
  - {id: 16-diag, kind: method, label: "§ 17, § 28; LSR § 3", section: 6, page: 352, source: "Очерки, LSR",
     statement: "диагностика рассуждений с неучтёнными координатами: выписать координаты каждой посылки и заключения ([xα]), найти смену координат (Aα ⊢ Aβ), конъюнкцию при разных координатах, «противоречие»/«исключённое третье» при разных координатах, вывод координат из высказывания, отбрасывание условия-конъюнкта; назвать нарушенное положение со страницей"}
