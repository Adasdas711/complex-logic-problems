<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комплексная логика — задачник</title>
<meta name="description" content="Задачник по книге А. А. Зиновьева «Комплексная логика» (1970): 90 занятий, 11 контрольных, 16 входных тестов.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&amp;display=swap">
<style>body{margin:0;background:#171717;color:#eee}</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="Разделы"></nav>
  <main class="main" id="main">
    <div class="wrap" id="view"><p class="muted">Загрузка…</p></div>
  </main>
</div>
<noscript><p style="padding:24px;color:#eee">Для сайта нужен JavaScript. Документы занятий есть и в папке zanyatiya/ репозитория.</p></noscript>
<script>
/* Свежие app.css и app.js при каждом открытии: версия читается из site_src/version.json мимо кэша браузера
   (GitHub Pages разрешает кэшировать саму страницу до 10 минут). */
(function () {
  function load(v) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'site_src/app.css?v=' + (v.css || '');
    document.head.appendChild(l);
    var s = document.createElement('script'); s.src = 'site_src/app.js?v=' + (v.js || ''); document.body.appendChild(s);
  }
  fetch('site_src/version.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(load).catch(function () { load({}); });
})();
</script>
</body>
</html>
