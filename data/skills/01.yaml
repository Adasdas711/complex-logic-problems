  - "A13 (с. 17): частный вид «xy : yz ⊢ (x : y)z» не согласуется с общим видом «x¹y : x²y : … ⊢ (x¹ : x² : …)y» и не является тавтологией (x = y = 1, z = 0) — опечатка. Задачи на частный вид A13 не ставятся."
