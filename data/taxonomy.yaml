# Классификация заданий. Подробное описание: docs/02-klassifikaciya.md

total: 1000

levels:
  1: {name: Узнавание, stars: "★"}
  2: {name: Применение, stars: "★★"}
  3: {name: Вывод, stars: "★★★"}
  4: {name: Метауровень, stars: "★★★★"}
  5: {name: Исследование, stars: "★★★★★"}

types:
  R: Распознавание
  T: Перевод и чтение
  A: Синтаксический анализ
  V: Вычисление значений истинности
  C: Проверка следования
  D: Построение вывода
  P: Парадоксы и непарадоксальность
  M: Метатеорема
  K: Контрпример и модель
  S: Сравнение систем
  F: Формализация рассуждения
  E: Поиск ошибки
  I: Исследование и эссе

forms:
  sym: Символьная (буквы x, y, a, b без содержания)
  nat: Естественно-языковая (обыденные и научные примеры)
  meta: Метатеоретическая (утверждения о системах)

answers:
  short: Короткий проверяемый ответ (да/нет, формула, значение, номер)
  proof: Доказательство или вывод
  build: Построение (модели, интерпретации, формулы, системы)
  text: Развёрнутый текст

# Смесь уровней (в процентах) и допустимые типы для каждого профиля параграфа.
profiles:
  O:
    name: Язык и определения
    levels: {1: 35, 2: 35, 3: 20, 4: 10, 5: 0}
    types: [R, T, A, F, E]
  S:
    name: Логическая система
    levels: {1: 10, 2: 30, 3: 40, 4: 15, 5: 5}
    types: [D, C, A, T, F, E, P]
  M:
    name: Метатеория
    levels: {1: 0, 2: 10, 3: 30, 4: 40, 5: 20}
    types: [M, K, C, E, I]
  I:
    name: Семантика и интерпретация
    levels: {1: 10, 2: 40, 3: 30, 4: 15, 5: 5}
    types: [V, C, K, E, T]
  F:
    name: Концепции, сравнения, парадоксы
    levels: {1: 15, 2: 15, 3: 20, 4: 25, 5: 25}
    types: [S, P, F, I, T, E]
  X:
    name: Сквозные задачи
    levels: {1: 0, 2: 0, 3: 30, 4: 40, 5: 30}
    types: [S, F, M, K, I, C]

# Квота параграфа = пропорционально числу страниц, не меньше min и не больше max.
quota:
  min_per_section: 5
  max_per_section: 22

# Целевые доли по всему задачнику (в процентах), контролируются в docs/progress.md.
targets:
  forms: {sym: 55, nat: 30, meta: 15}
  answers: {short: 35, proof: 35, build: 15, text: 15}
  series_max: 25   # не больше 25 % задач — серии однотипных упражнений
