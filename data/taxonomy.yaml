# Классификация заданий. Подробное описание: docs/02-klassifikaciya.md

total: 3600

# Десять ступеней. Признаки: число шагов, дана ли цель, подсказан ли путь,
# одна система или несколько, уровень (формулы или утверждения о системе).
levels:
  1: {name: Опознание, short: "Опознать объект по одному определению"}
  2: {name: Подстановка, short: "Применить одно правило или аксиому, 1–2 шага"}
  3: {name: Алгоритм, short: "Выполнить известную процедуру, 3–6 шагов"}
  4: {name: Дополнение, short: "Восстановить пропущенные шаги и основания в готовом решении"}
  5: {name: Короткий вывод, short: "Самостоятельно построить вывод или решение, 3–7 шагов, цель дана"}
  6: {name: Открытый исход, short: "Самому выяснить, верно ли утверждение, и доказать или опровергнуть"}
  7: {name: Перенос, short: "Решить в нескольких системах или случаях, найти разделяющую формулу"}
  8: {name: Метатеорема по образцу, short: "Адаптировать доказательство из книги к новому случаю"}
  9: {name: Новая метатеорема, short: "Доказать новое утверждение о системе"}
  10: {name: Исследование, short: "Построить систему для нового оператора, проверить доказательства автора"}

types:
  R: Распознавание
  T: Перевод и чтение
  A: Синтаксический анализ
  V: Вычисление значений истинности
  C: Проверка следования
  D: Построение вывода
  P: Парадоксы и непарадоксальность
  M: Метатеорема
  K: Контрпример и модель
  S: Сравнение систем
  F: Формализация рассуждения
  E: Диагностика ошибки
  I: Исследование

# Полнота условия (по типологии учебных задач).
conditions:
  def: Определённая — данных ровно столько, сколько нужно
  alt: С альтернативным условием — ответ зависит от разбора вариантов
  under: Неопределённая — данных не хватает, нужно сказать, чего именно
  over: Переопределённая — есть лишние данные, которые нужно отбросить

# Шаг лестницы внутри параграфа.
steps:
  complete: Дополнение решения
  iso: Изоморфная задача (та же схема, другие данные)
  vary: Вариация по Пойа (обобщение, специализация, аналогия, обращение)
  open: Открытый исход
  transfer: Перенос в другие системы и случаи
  mixed: Смешанное повторение

forms:
  sym: Символьная
  nat: Естественно-языковая
  meta: Метатеоретическая

answers:
  short: Короткий проверяемый ответ
  proof: Доказательство или вывод
  build: Построение
  text: Развёрнутый текст

# Смесь ступеней (в процентах) и типичные типы для каждого профиля параграфа.
# Лестница задач даёт в каждом параграфе опознание (R), открытый исход (C),
# перенос в другую систему (S) и, где есть ступени 8–9, метатеоремы (M) —
# поэтому эти типы входят в списки почти всех профилей.
profiles:
  O:
    name: Язык и определения
    levels: {1: 20, 2: 25, 3: 25, 4: 10, 5: 5, 6: 10, 7: 5, 8: 0, 9: 0, 10: 0}
    types: [R, T, A, F, E, C, D, S, M]
  S:
    name: Логическая система
    levels: {1: 3, 2: 10, 3: 12, 4: 15, 5: 25, 6: 20, 7: 10, 8: 2, 9: 2, 10: 1}
    types: [D, C, A, T, F, E, P, R, S, M, I]
  M:
    name: Метатеория
    levels: {1: 0, 2: 3, 3: 7, 4: 15, 5: 10, 6: 15, 7: 10, 8: 20, 9: 15, 10: 5}
    types: [M, K, C, E, I, D, S, R, V, A, T]
  I:
    name: Семантика и интерпретация
    levels: {1: 5, 2: 15, 3: 30, 4: 10, 5: 10, 6: 15, 7: 10, 8: 3, 9: 2, 10: 0}
    types: [V, C, K, E, T, R, S, M, D]
  F:
    name: Концепции, сравнения, парадоксы
    levels: {1: 5, 2: 5, 3: 10, 4: 5, 5: 10, 6: 15, 7: 20, 8: 10, 9: 10, 10: 10}
    types: [S, P, F, I, T, E, C, M, R, D, A, V]
  E:
    name: Диагностика
    levels: {1: 0, 2: 10, 3: 20, 4: 10, 5: 15, 6: 25, 7: 15, 8: 0, 9: 0, 10: 5}
    types: [E, F]
  X:
    name: Смешанное повторение
    levels: {1: 0, 2: 10, 3: 15, 4: 5, 5: 20, 6: 25, 7: 15, 8: 5, 9: 3, 10: 2}
    types: [E, F, C, D, V, S, K, M, R, I, A, T]

# Доля задач-диагностик (тип E) в каждом параграфе; в профиле E — все задачи.
diagnostic_share: 25

quota:
  min_per_section: 10
  max_per_section: 120

# Занятие по образцу семинара Зиновьева: 4–6 часов, два раза в неделю.
sessions:
  size: 40
  per_week: 2

targets:
  forms: {sym: 50, nat: 35, meta: 15}
  answers: {short: 40, proof: 35, build: 15, text: 10}
